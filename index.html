      requestAnimationFrame(() => {
        const focusables = [...el.drawer.querySelectorAll("[data-drawer-index]")];
        focusables.forEach((node) => {
          node.classList.toggle("is-focused", Number(node.dataset.drawerIndex) === state.drawerFocusIndex);
        });
      });
    }

    function showPrompt(type, seconds) {
      clearInterval(promptTimer);
      state.promptType = type;
      state.promptCountdown = seconds;
      const isBlack = type === "black";
      el.prompt.className = `prompt show ${isBlack ? "dark" : ""}`;
      el.prompt.innerHTML = `
        <div class="prompt-copy">
          <div class="prompt-title">${isBlack ? "即将为您自动黑屏，可任意按键唤起或打断" : "即将为您自动切换至水墨屏低功耗模式"}</div>
          <div class="prompt-sub">倒计时结束后自动切换</div>
        </div>
        <div class="prompt-count">${seconds}</div>
      `;
      promptTimer = setInterval(() => {
        state.promptCountdown -= 1;
        if (state.promptCountdown <= 0) {
          hidePrompt();
          if (type === "sleep") enterSleep();
          if (type === "black") enterBlack();
          return;
        }
        const count = el.prompt.querySelector(".prompt-count");
        if (count) count.textContent = state.promptCountdown;
      }, 1000);
    }

    function hidePrompt() {
      clearInterval(promptTimer);
      state.promptType = null;
      el.prompt.classList.remove("show", "dark");
    }

    function wakeOverlay() {
      if (state.page !== "play" && state.page !== "immersive") return;
      if (state.seasonPanelOpen) return;
      state.overlayVisible = true;
      renderPlay();
      renderImmersive();
      clearTimeout(state.overlayTimer);
      state.overlayTimer = setTimeout(() => {
        if (state.seasonPanelOpen) return;
        state.overlayVisible = false;
        renderPlay();
        renderImmersive();
      }, 5000);
    }

    function touchInteraction() {
      state.lastInteractionAt = Date.now();
      if (state.page === "play" || state.page === "immersive") {
        wakeOverlay();
      }
      if (state.page !== "sleep" && state.page !== "black") {
        hidePrompt();
      }
      updateStatus();
    }

    function updateStatus() {
      if (state.page === "play" || state.page === "immersive") {
        if (!state.settings.allowSleep) {
          el.statusTitle.textContent = "息屏显示已关闭";
          el.statusSub.textContent = "当前会持续停留在窗景播放层，不再自动进入低功耗状态。";
          return;
        }
        const elapsed = Math.floor((Date.now() - state.lastInteractionAt) / 1000);
        const remain = Math.max(0, state.settings.sleepTimeout - elapsed);
        el.statusTitle.textContent = `距离进入息屏还有 ${remain} 秒`;
        el.statusSub.textContent = state.settings.allowBlack
          ? `息屏后还将继续倒计时 ${state.settings.blackTimeout} 秒进入黑屏。`
          : "黑屏开关已关闭，到达息屏层后会继续停留。";
        return;
      }
      if (state.page === "sleep") {
        if (!state.settings.allowBlack) {
          el.statusTitle.textContent = "当前处于息屏显示";
          el.statusSub.textContent = "黑屏阀门关闭，息屏层将持续保持。";
          return;
        }
        const elapsed = Math.floor((Date.now() - state.sleepStartedAt) / 1000);
        const remain = Math.max(0, state.settings.blackTimeout - elapsed);
        el.statusTitle.textContent = `距离进入黑屏还有 ${remain} 秒`;
        el.statusSub.textContent = "任意按键可直接返回首页。";
        return;
      }
      el.statusTitle.textContent = "浏览窗景首页";
      el.statusSub.textContent = "通过遥控器左右切换，OK 进入当前窗景。";
    }

    function setPage(page) {
      state.page = page;
      if (state.drawer && (page === "sleep" || page === "black" || page === "immersive")) closeDrawer();
      if (page !== "play") {
        state.seasonPanelOpen = false;
        state.sceneFading = false;
      }
      el.homeView.classList.toggle("active", page === "home");
      el.playView.classList.toggle("active", page === "play");
      el.immersiveView.classList.toggle("active", page === "immersive");
      el.sleepView.classList.toggle("active", page === "sleep");
      el.blackView.classList.toggle("active", page === "black");
      if (page === "play" || page === "immersive") wakeOverlay();
      updateStatus();
      refreshAutoplay();
    }

    function enterPlay() {
      clearTimeout(state.playOpeningTimer);
      state.playFocusZone = "stage";
      state.railIndex = 0;
      state.overlayVisible = true;
      state.playOpening = true;
      setPage("play");
      state.playOpeningTimer = setTimeout(() => {
        state.playOpening = false;
        renderPlay();
      }, 760);
      touchInteraction();
    }

    function exitToHome() {
      clearTimeout(state.playOpeningTimer);
      state.playOpening = false;
      setPage("home");
      touchInteraction();
    }

    function enterImmersive() {
      setPage("immersive");
      touchInteraction();
    }

    function exitImmersive() {
      setPage("play");
      touchInteraction();
    }

    function enterSleep() {
      state.sleepStartedAt = Date.now();
      setPage("sleep");
      renderSleep();
    }

    function enterBlack() {
      setPage("black");
    }

    function wakeFromSleep(target = "home") {
      if (target === "play") {
        setPage("play");
        showToast("????????");
      } else {
        setPage("home");
        showToast("????????");
      }
      touchInteraction();
    }

    function wakeFromBlack() {
      setPage("home");
      showToast("已从黑屏返回 Launcher");
      touchInteraction();
    }

    function toggleFavorite() {
      toggleFavoriteScene(currentScene().id);
    }

    function toggleFavoriteScene(sceneId) {
      const scene = sceneSeeds.find((item) => item.id === sceneId);
      if (!scene) return;
      if (state.favorites.has(scene.id)) {
        state.favorites.delete(scene.id);
        showToast(`已取消收藏 ${scene.shortTitle}`);
      } else {
        state.favorites.add(scene.id);
        showToast(`已收藏 ${scene.shortTitle}`);
      }
      persist();
      renderAll();
      renderDrawer();
    }

    function setCurrentSceneAsScreensaver() {
      setScreensaverScene(currentScene().id);
    }

    function setScreensaverScene(sceneId) {
      const scene = sceneSeeds.find((item) => item.id === sceneId);
      if (!scene) return;
      state.screensaverSceneId = scene.id;
      persist();
      showToast(`\u5df2\u5c06 ${sceneListMeta(scene).title} \u8bbe\u4e3a\u5c4f\u4fdd`);
      renderAll();
      renderDrawer();
    }

    function unsetScreensaverScene(sceneId = state.screensaverSceneId) {
      if (state.screensaverSceneId !== sceneId) return;
      state.screensaverSceneId = null;
      persist();
      showToast("\u5df2\u53d6\u6d88\u5f53\u524d\u5c4f\u4fdd");
      renderAll();
      renderDrawer();
    }

    function setScreensaverSetting(type, value) {
      if (type === "start") state.settings.screensaverStartTime = Number(value);
      if (type === "mode") state.settings.screensaverPlayMode = value;
      if (type === "info") state.settings.screensaverInfoMode = value;
      normalizeSettings();
      persist();
      renderDrawer();
      showToast("\u5c4f\u4fdd\u8bbe\u7f6e\u5df2\u66f4\u65b0");
    }

    function triggerScreensaverDrawerItem(item) {
      const action = item.dataset.screensaverAction;
      if (action === "set") {
        setScreensaverScene(item.dataset.sceneId);
        return true;
      }
      if (action === "unset") {
        unsetScreensaverScene(item.dataset.sceneId);
        return true;
      }
      if (item.dataset.screensaverSetting) {
        setScreensaverSetting(item.dataset.screensaverSetting, item.dataset.screensaverValue);
        return true;
      }
      return false;
    }

    function toggleListCategory(key) {
      if (!key) return;
      state.collapsedGroups = {
        ...state.collapsedGroups,
        [key]: !state.collapsedGroups[key]
      };
      persist();
      renderDrawer();
    }

    function refreshAutoplay() {
      clearInterval(homeAutoplayTimer);
      if (state.page !== "home" || state.drawer || !state.settings.autoplayHome) return;
      homeAutoplayTimer = setInterval(() => {
        if (state.page !== "home" || state.drawer) return;
        setScene(state.index + 1);
      }, state.settings.autoplayInterval * 1000);
    }

    function setToolbarIndex(index) {
      const buttons = [...el.homeToolbar.querySelectorAll(".icon-btn")];
      state.toolbarIndex = clamp(index, 0, buttons.length - 1);
      renderHome();
    }

    function setRailIndex(index) {
      const buttons = [...el.playRail.querySelectorAll(".rail-btn")];
      state.railIndex = clamp(index, 0, buttons.length - 1);
      renderPlay();
    }

    function triggerHomeAction(action) {
      if (action === "screensaver") openDrawer("screensaver");
      if (action === "menu") openDrawer("menu");
      if (action === "favorite") {
        toggleFavorite();
        state.homeFocusZone = "hero";
        renderHome();
      }
      if (action === "settings") openDrawer("settings");
    }

    function triggerRailAction(action) {
      if (currentScene().group !== "window") return;
      if (action === "immersive") enterImmersive();
      if (action === "season") openSeasonPanel();
    }

    function drawerItems() {
      return [...el.drawer.querySelectorAll("[data-drawer-index]")];
    }

    function setDrawerFocus(index) {
      const items = drawerItems();
      if (!items.length) return;
      state.drawerFocusIndex = clamp(index, 0, items.length - 1);
      items.forEach((node) => {
        node.classList.toggle("is-focused", Number(node.dataset.drawerIndex) === state.drawerFocusIndex);
      });
    }

    function toggleSettingKey(key) {
      state.settings[key] = !state.settings[key];
      normalizeSettings();
      persist();
      renderAll();
      renderDrawer();
      showToast(`${settingLabel(key)}已${state.settings[key] ? "开启" : "关闭"}`);
    }

    function adjustRangeKey(key, step, min, max, direction) {
      state.settings[key] = clamp(state.settings[key] + step * direction, min, max);
      normalizeSettings();
      persist();
      renderDrawer();
      updateStatus();
      refreshAutoplay();
    }

    function handleDrawerKey(event) {
      const items = drawerItems();
      if (!items.length) return false;

      if (event.key === "ArrowUp") {
        setDrawerFocus(state.drawerFocusIndex - 1);
        return true;
      }
      if (event.key === "ArrowDown") {
        setDrawerFocus(state.drawerFocusIndex + 1);
        return true;
      }

      const current = items[state.drawerFocusIndex];
      if (!current) return false;
      if (current.classList.contains("disabled")) return false;

      if (state.drawer === "menu") {
        if (event.key === "Enter" || event.key === " ") {
          if (current.dataset.categoryToggle) {
            toggleListCategory(current.dataset.categoryToggle);
            return true;
          }
          selectSceneById(current.dataset.sceneId);
          closeDrawer();
          return true;
        }
        return false;
      }

      if (state.drawer === "screensaver") {
        if (event.key === "Enter" || event.key === " ") {
          return triggerScreensaverDrawerItem(current);
        }
        return false;
      }

      const type = current.dataset.controlType;
      const key = current.dataset.controlKey;
      if (!type || !key) return false;

      if (type === "toggle" && (event.key === "Enter" || event.key === " " || event.key === "ArrowLeft" || event.key === "ArrowRight")) {
        toggleSettingKey(key);
        return true;
      }

      if (type === "range" && (event.key === "ArrowLeft" || event.key === "ArrowRight")) {
        adjustRangeKey(
          key,
          Number(current.dataset.step),
          Number(current.dataset.min),
          Number(current.dataset.max),
          event.key === "ArrowRight" ? 1 : -1
        );
        return true;
      }

      return false;
    }

    function handleHomeKey(event) {
      if (state.homeFocusZone === "hero") {
        if (event.key === "ArrowLeft") {
          setScene(state.index - 1, true);
          return true;
        }
        if (event.key === "ArrowRight") {
          setScene(state.index + 1, true);
          return true;
        }
        if (event.key === "ArrowUp") {
          state.homeFocusZone = "toolbar";
          renderHome();
          return true;
        }
        if (event.key === "ArrowDown") {
          state.homeFocusZone = "categories";
          state.categoryFocusIndex = contentCategories.findIndex((category) => category.key === state.categoryKey);
          renderHome();
          return true;
        }
        if (event.key === "Enter" || event.key === " ") {
          enterPlay();
          return true;
        }
      } else if (state.homeFocusZone === "categories") {
        if (event.key === "ArrowLeft") {
          const nextIndex = (state.categoryFocusIndex - 1 + contentCategories.length) % contentCategories.length;
          state.categoryFocusIndex = nextIndex;
          selectCategory(contentCategories[nextIndex].key);
          state.homeFocusZone = "categories";
          return true;
        }
        if (event.key === "ArrowRight") {
          const nextIndex = (state.categoryFocusIndex + 1) % contentCategories.length;
          state.categoryFocusIndex = nextIndex;
          selectCategory(contentCategories[nextIndex].key);
          state.homeFocusZone = "categories";
          return true;
        }
        if (event.key === "ArrowUp") {
          state.homeFocusZone = "hero";
          renderHome();
          return true;
        }
        if (event.key === "Enter" || event.key === " ") {
          state.homeFocusZone = "hero";
          renderHome();
          return true;
        }
      } else {
        if (event.key === "ArrowLeft") {
          setToolbarIndex(state.toolbarIndex - 1);
          return true;
        }
        if (event.key === "ArrowRight") {
          setToolbarIndex(state.toolbarIndex + 1);
          return true;
        }
        if (event.key === "ArrowDown") {
          state.homeFocusZone = "hero";
          renderHome();
          return true;
        }
        if (event.key === "Enter" || event.key === " ") {
          const action = el.homeToolbar.querySelectorAll(".icon-btn")[state.toolbarIndex]?.dataset.homeAction;
          if (action) triggerHomeAction(action);
          return true;
        }
      }
      return false;
    }

    function handlePlayKey(event) {
      const isWindowContent = currentScene().group === "window";
      if (state.seasonPanelOpen) {
        if (event.key === "Escape" || event.key === "Backspace") {
          closeSeasonPanel();
          return true;
        }
        if (event.key === "ArrowLeft") {
          setSeasonPanelFocus(state.seasonFocusIndex - 1);
          return true;
        }
        if (event.key === "ArrowRight") {
          setSeasonPanelFocus(state.seasonFocusIndex + 1);
          return true;
        }
        if (event.key === "ArrowUp") {
          setSeasonPanelFocus(state.seasonFocusIndex <= 1 ? state.seasonFocusIndex + 10 : state.seasonFocusIndex - 2);
          return true;
        }
        if (event.key === "ArrowDown") {
          setSeasonPanelFocus(state.seasonFocusIndex <= 1 ? state.seasonFocusIndex + 2 : state.seasonFocusIndex + 2);
          return true;
        }
        if (event.key === "Enter" || event.key === " ") {
          triggerSeasonPanelControl();
          return true;
        }
        return false;
      }

      if (!isWindowContent) {
        if (event.key === "ArrowLeft") {
          switchSceneWithFade(state.index - 1);
          return true;
        }
        if (event.key === "ArrowRight") {
          switchSceneWithFade(state.index + 1);
          return true;
        }
        return false;
      }

      if (state.playFocusZone === "rail") {
        if (event.key === "ArrowUp") {
          setRailIndex(state.railIndex - 1);
          return true;
        }
        if (event.key === "ArrowDown") {
          setRailIndex(state.railIndex + 1);
          return true;
        }
        if (event.key === "ArrowLeft") {
          state.playFocusZone = "stage";
          renderPlay();
          return true;
        }
        if (event.key === "Enter" || event.key === " ") {
          const action = el.playRail.querySelectorAll(".rail-btn")[state.railIndex]?.dataset.railAction;
          if (action) triggerRailAction(action);
          return true;
        }
      } else {
        if (event.key === "ArrowLeft") {
          switchSceneWithFade(state.index - 1);
          return true;
        }
        if (event.key === "ArrowRight") {
          switchSceneWithFade(state.index + 1);
          return true;
        }
        if (event.key === "ArrowUp" || event.key === "ArrowDown") {
          state.playFocusZone = "rail";
          renderPlay();
          return true;
        }
      }
      if (event.key === "ArrowLeft") {
        switchSceneWithFade(state.index - 1);
        return true;
      }
      if (event.key === "ArrowRight") {
        switchSceneWithFade(state.index + 1);
        return true;
      }
      return false;
    }

    function attachEvents() {
      el.prevButton.addEventListener("click", () => { setScene(state.index - 1, true); touchInteraction(); });
      el.nextButton.addEventListener("click", () => { setScene(state.index + 1, true); touchInteraction(); });
      el.leftStageArrow.addEventListener("click", () => { setScene(state.index - 1, true); touchInteraction(); });
      el.rightStageArrow.addEventListener("click", () => { setScene(state.index + 1, true); touchInteraction(); });
      el.heroWindow.addEventListener("click", enterPlay);
      el.homeFavoriteAction?.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleFavorite();
        state.homeFocusZone = "hero";
        renderHome();
        touchInteraction();
      });
      el.homeScreensaverAction?.addEventListener("click", (event) => {
        event.stopPropagation();
        if (state.screensaverSceneId === currentScene().id) {
          unsetScreensaverScene(currentScene().id);
        } else {
          setCurrentSceneAsScreensaver();
        }
        state.homeFocusZone = "hero";
        renderHome();
        touchInteraction();
      });
      el.backButton.addEventListener("click", exitToHome);
      el.playSettings.addEventListener("click", () => openDrawer("settings"));
      el.drawerMask.addEventListener("click", closeDrawer);
      el.sleepView.addEventListener("click", wakeFromSleep);
      el.blackView.addEventListener("click", wakeFromBlack);
      el.immersiveExit.addEventListener("click", exitImmersive);
      el.immersivePrev.addEventListener("click", () => { setScene(state.index - 1, true); touchInteraction(); });
      el.immersiveNext.addEventListener("click", () => { setScene(state.index + 1, true); touchInteraction(); });

      el.homeToolbar.addEventListener("click", (event) => {
        const button = event.target.closest("[data-home-action]");
        if (!button) return;
        state.homeFocusZone = "toolbar";
        state.toolbarIndex = [...el.homeToolbar.querySelectorAll(".icon-btn")].indexOf(button);
        triggerHomeAction(button.dataset.homeAction);
        renderHome();
        touchInteraction();
      });

      el.playRail.addEventListener("click", (event) => {
        const button = event.target.closest("[data-rail-action]");
        if (!button) return;
        state.playFocusZone = "rail";
        state.railIndex = [...el.playRail.querySelectorAll(".rail-btn")].indexOf(button);
        triggerRailAction(button.dataset.railAction);
        renderPlay();
        touchInteraction();
      });

      el.seasonPanel.addEventListener("click", (event) => {
        const pick = event.target.closest("[data-season-type]");
        if (pick) {
          applySeasonChoice(pick.dataset.seasonType, pick.dataset.seasonValue);
          state.seasonFocusIndex = seasonPanelControls().indexOf(pick);
          renderSeasonPanel();
          return;
        }
        if (event.target.closest("#seasonRandom")) {
          randomizeSeasonPanel();
          return;
        }
        if (event.target.closest("#seasonReset")) {
          resetSeasonPanelToRealtime();
        }
      });

      document.addEventListener("click", (event) => {
        const dot = event.target.closest("[data-dot]");
        if (dot) {
          setScene(Number(dot.dataset.dot), true);
          touchInteraction();
        }
        const category = event.target.closest("[data-category]");
        if (category) {
          state.homeFocusZone = "categories";
          selectCategory(category.dataset.category);
          touchInteraction();
        }
      });

      el.drawer.addEventListener("click", (event) => {
        const close = event.target.closest("[data-close-drawer]");
        if (close) {
          closeDrawer();
          return;
        }
        const favoriteScene = event.target.closest("[data-favorite-scene-id]");
        if (favoriteScene) {
          event.stopPropagation();
          toggleFavoriteScene(favoriteScene.dataset.favoriteSceneId);
          return;
        }
        const categoryToggle = state.drawer === "menu" ? event.target.closest("[data-category-toggle]") : null;
        if (categoryToggle) {
          toggleListCategory(categoryToggle.dataset.categoryToggle);
          return;
        }
        const sceneItem = state.drawer === "menu" ? event.target.closest("[data-scene-id]") : null;
        if (sceneItem) {
          selectSceneById(sceneItem.dataset.sceneId);
          closeDrawer();
          return;
        }
        const screensaverItem = event.target.closest("[data-screensaver-action], [data-screensaver-setting]");
        if (screensaverItem) {
          triggerScreensaverDrawerItem(screensaverItem);
          return;
        }
        const seasonAction = event.target.closest("[data-season-action]");
        if (seasonAction) {
          const labels = {
            realtime: "当前已切换为实时同步",
            sunset: "黄昏演绎将在下一版接入实时预览",
            winter: "冬季演绎将在下一版接入实时预览"
          };
          showToast(labels[seasonAction.dataset.seasonAction] || "时季调节已更新");
        }
      });

      el.drawer.addEventListener("input", (event) => {
        const target = event.target;
        if (target.dataset.setting) {
          state.settings[target.dataset.setting] = target.checked;
          normalizeSettings();
          persist();
          renderAll();
          showToast(`${settingLabel(target.dataset.setting)}已${state.settings[target.dataset.setting] ? "开启" : "关闭"}`);
          return;
        }
        if (target.dataset.range) {
          state.settings[target.dataset.range] = Number(target.value);
          normalizeSettings();
          persist();
          renderDrawer();
          updateStatus();
          refreshAutoplay();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (state.page === "black") {
          event.preventDefault();
          wakeFromBlack();
          return;
        }

        if (state.page === "sleep") {
          event.preventDefault();
          const returnToPlay = event.key === "Escape" || event.key === "Backspace" || event.key === " ";
          wakeFromSleep(returnToPlay ? "play" : "home");
          return;
        }

        if (state.drawer) {
          const handled = handleDrawerKey(event);
          if (handled) {
            event.preventDefault();
          }
          if (event.key === "Escape" || event.key === "Backspace") {
            event.preventDefault();
            closeDrawer();
          }
          touchInteraction();
          return;
        }

        if (event.key.toLowerCase() === "s") {
          event.preventDefault();
          openDrawer("settings");
          touchInteraction();
          return;
        }

        if (event.key.toLowerCase() === "m") {
          event.preventDefault();
          openDrawer("menu");
          touchInteraction();
          return;
        }

        if (state.page === "play" && state.seasonPanelOpen && (event.key === "Escape" || event.key === "Backspace")) {
          event.preventDefault();
          closeSeasonPanel();
          touchInteraction();
          return;
        }

        if (event.key === "Escape" || event.key === "Backspace") {
          event.preventDefault();
          if (state.page === "immersive") {
            exitImmersive();
          } else if (state.page === "play") {
            exitToHome();
          }
          return;
        }

        let handled = false;
        if (state.page === "home") handled = handleHomeKey(event);
        if (state.page === "play") handled = handlePlayKey(event);
        if (state.page === "immersive") {
          if (event.key === "ArrowLeft") { setScene(state.index - 1, true); handled = true; }
          if (event.key === "ArrowRight") { setScene(state.index + 1, true); handled = true; }
          if (event.key === "Enter" || event.key === " ") { exitImmersive(); handled = true; }
        }

        if (handled) {
          event.preventDefault();
          touchInteraction();
        }
      });

      ["click", "touchstart"].forEach((name) => {
        document.addEventListener(name, () => {
          if (state.page !== "sleep" && state.page !== "black") touchInteraction();
        }, { passive: true });
      });
    }

    function settingLabel(key) {
      const map = {
        showInfo: "嵌入式信息",
        autoplayHome: "首页自动轮播",
        allowSleep: "息屏显示",
        allowBlack: "黑屏模式",
        reduceMotion: "减少动效"
      };
      return map[key] || key;
    }

    function tick() {
      refreshVisibleTimeOnly();

      if (state.page === "home") {
        if (state.drawer) return;
        const targetScene = resolveScreensaverStartScene();
        if (!targetScene) return;
        const elapsed = Math.floor((Date.now() - state.lastInteractionAt) / 1000);
        if (elapsed >= state.settings.screensaverStartTime * 60) {
          selectSceneById(targetScene.id);
          enterPlay();
        }
        return;
      }

      if (state.page === "play" || state.page === "immersive") {
        if (!state.settings.allowSleep || state.drawer) return;
        const elapsed = Math.floor((Date.now() - state.lastInteractionAt) / 1000);
        const remain = state.settings.sleepTimeout - elapsed;
        if (remain <= 3 && remain > 0 && state.promptType !== "sleep") showPrompt("sleep", remain);
        if (remain <= 0 && state.promptType !== "sleep") enterSleep();
        return;
      }

      if (state.page === "sleep") {
        if (!state.settings.allowBlack) return;
        const elapsed = Math.floor((Date.now() - state.sleepStartedAt) / 1000);
        const remain = state.settings.blackTimeout - elapsed;
        if (remain <= 3 && remain > 0 && state.promptType !== "black") showPrompt("black", remain);
        if (remain <= 0 && state.promptType !== "black") enterBlack();
      }
    }

    function boot() {
      loadPersisted();
      if (!state.visualByScene[currentScene().id]) {
        saveSceneVisualState(currentScene(), {
          realtime: state.visualRealtime !== false,
          preset: state.visualRealtime === false ? state.visualPreset : realtimeVisualPreset()
        });
      }
      syncCurrentVisualState();
      renderAll();
      attachEvents();
      refreshWeather();
      setInterval(refreshWeather, 10 * 60 * 1000);
      setInterval(tick, 1000);
    }

    boot();
  </script>
</body>
</html>
