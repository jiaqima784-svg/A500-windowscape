<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A500 窗景 Demo</title>
  <style>
    :root {
      --bg-top: #d8ded9;
      --bg-bottom: #7c8d93;
      --accent: #d9ecef;
      --text: rgba(255, 255, 255, 0.98);
      --text-2: rgba(255, 255, 255, 0.78);
      --text-3: rgba(255, 255, 255, 0.52);
      --panel: rgba(255, 255, 255, 0.12);
      --line: rgba(255, 255, 255, 0.16);
      --shadow-lg: 0 36px 90px rgba(0, 0, 0, 0.24);
      --shadow-md: 0 18px 40px rgba(0, 0, 0, 0.18);
      --ease: cubic-bezier(.22, .82, .2, 1);
      --window-base: rgba(242, 236, 227, 0.52);
      --window-edge: rgba(255, 255, 255, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "SF Pro Display", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 16%, rgba(255, 255, 255, 0.26), transparent 18%),
        radial-gradient(circle at 84% 14%, rgba(255, 237, 210, 0.22), transparent 16%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    }

    body.reduce-motion *,
    body.reduce-motion *::before,
    body.reduce-motion *::after {
      animation: none !important;
      transition-duration: 0.01ms !important;
    }

    button,
    input {
      font: inherit;
      color: inherit;
    }

    button {
      border: none;
      background: none;
      cursor: pointer;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      isolation: isolate;
    }

    .ambient {
      position: absolute;
      inset: -8%;
      z-index: 0;
      filter: blur(32px) saturate(1.04);
      transform: scale(1.08);
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.18), transparent 34%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      transition: background .5s var(--ease);
    }

    .ambient::before,
    .ambient::after {
      content: "";
      position: absolute;
      inset: 0;
    }

    .ambient::before {
      background:
        radial-gradient(circle at 20% 22%, rgba(255,255,255,0.14), transparent 18%),
        radial-gradient(circle at 80% 18%, rgba(255,248,235,0.18), transparent 16%),
        linear-gradient(180deg, rgba(10, 18, 28, 0.04), rgba(10, 18, 28, 0.18));
    }

    .ambient::after {
      background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent 28%, transparent 74%, rgba(255,255,255,0.04));
      mix-blend-mode: screen;
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.12;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.26) 0 1px, transparent 1px),
        radial-gradient(circle at 72% 64%, rgba(255,255,255,.18) 0 1px, transparent 1px);
      background-size: 220px 220px, 280px 280px;
    }

    .shell {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 34px 42px;
      display: flex;
      flex-direction: column;
    }

    .view {
      display: none;
      width: 100%;
      height: 100%;
    }

    .view.active {
      display: flex;
    }

    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: flex-start;
      gap: 18px;
    }

    .brand-mark {
      width: 52px;
      height: 72px;
      stroke: rgba(255,255,255,0.92);
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.92;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .brand-copy h1 {
      font-size: 34px;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .brand-copy p {
      font-size: 13px;
      line-height: 1.7;
      color: rgba(255,255,255,0.68);
      max-width: 300px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .toolbar-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .toolbar-item label {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.74);
      transition: color .22s ease, transform .22s var(--ease), opacity .22s ease;
    }

    .icon-btn {
      position: relative;
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(16px) saturate(130%);
      -webkit-backdrop-filter: blur(16px) saturate(130%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), var(--shadow-md);
      transition: transform .24s var(--ease), background .24s ease, box-shadow .24s ease;
    }

    .icon-btn::after {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0);
      box-shadow: 0 0 0 0 rgba(160,205,255,0);
      pointer-events: none;
      transition: border-color .22s ease, box-shadow .22s ease, opacity .22s ease;
      opacity: 0;
    }

    .icon-btn:hover,
    .icon-btn:focus-visible,
    .icon-btn.is-focused {
      transform: translateY(-3px) scale(1.06);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.13)),
        rgba(255,255,255,0.16);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 22px 52px rgba(0,0,0,0.24), 0 0 0 5px rgba(255,255,255,0.08);
      outline: none;
    }

    .icon-btn:hover::after,
    .icon-btn:focus-visible::after,
    .icon-btn.is-focused::after {
      opacity: 1;
      border-color: rgba(255,255,255,0.78);
      box-shadow: 0 0 0 5px rgba(142,194,255,0.14), 0 0 24px rgba(180,220,255,0.22);
    }

    .icon-btn.is-focused + label,
    .icon-btn:hover + label,
    .icon-btn:focus-visible + label {
      color: rgba(255,255,255,0.96);
      transform: translateY(1px);
    }

    .icon-btn svg,
    .drawer-close svg,
    .chip svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .home-view {
      flex-direction: column;
    }

    .home-stage {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(120px, 220px) minmax(900px, 1fr) minmax(120px, 220px);
      gap: 24px;
      align-items: center;
      perspective: 1200px;
      position: relative;
    }

    .preview-slot {
      position: relative;
      height: min(56vh, 520px);
      opacity: 0.66;
      filter: saturate(.86) brightness(.9);
      transition: opacity .28s ease, filter .28s ease, transform .36s var(--ease);
    }

    .preview-slot.left { transform: translateX(-18px) rotateY(9deg); }
    .preview-slot.right { transform: translateX(18px) rotateY(-9deg); }
    .preview-slot:hover,
    .preview-slot:focus-visible {
      opacity: .92;
      filter: saturate(.96) brightness(.98);
      outline: none;
    }

    .preview-slot:hover .window-shell.preview,
    .preview-slot:focus-visible .window-shell.preview {
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 30px 72px rgba(0,0,0,0.22), 0 0 0 4px rgba(255,255,255,0.08);
    }

    .hero-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      min-width: 0;
    }

    .home-hero-wrap {
      position: relative;
      width: min(100%, 1160px);
      overflow: visible;
    }

    .home-hero-wrap .window-shell.hero {
      width: 100%;
    }

    .home-quick-actions {
      position: absolute;
      left: calc(100% + 22px);
      top: 7%;
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.018)),
        rgba(255,255,255,0.018);
      border: 1px solid rgba(255,255,255,0.075);
      backdrop-filter: blur(14px) saturate(125%);
      -webkit-backdrop-filter: blur(14px) saturate(125%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 14px 32px rgba(0,0,0,0.07);
      opacity: 0;
      transform: translateX(-10px) scale(.98);
      pointer-events: none;
      transition: opacity .28s var(--ease), transform .28s var(--ease);
    }

    .home-quick-actions.show,
    .home-hero-wrap:hover .home-quick-actions {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
    }

    .home-quick-action {
      width: 126px;
      height: 42px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 9px;
      border-radius: 999px;
      color: rgba(255,255,255,0.88);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.105), rgba(255,255,255,0.035)),
        rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.095);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
      font-size: 13px;
      letter-spacing: 0.04em;
      transition: transform .22s var(--ease), background .22s ease, box-shadow .22s ease;
    }

    .home-quick-action:hover,
    .home-quick-action:focus-visible {
      transform: translateY(-2px);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.07)),
        rgba(255,255,255,0.09);
      color: rgba(255,255,255,0.98);
      box-shadow: 0 14px 30px rgba(0,0,0,0.14), 0 0 0 4px rgba(255,255,255,0.055);
      outline: none;
    }

    .home-quick-action svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hero-title-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .hero-title-group .kicker {
      font-size: 12px;
      letter-spacing: 0.24em;
      color: var(--text-3);
      text-transform: uppercase;
    }

    .hero-title-group h2 {
      font-size: clamp(38px, 3.4vw, 54px);
      font-weight: 400;
      letter-spacing: 0.12em;
      font-family: "STKaiti", "KaiTi", "Noto Serif SC", "Songti SC", serif;
      text-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .hero-title-group p {
      font-size: 12px;
      line-height: 1.7;
      color: rgba(255,255,255,0.58);
      max-width: 380px;
    }

    .window-shell {
      position: relative;
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      background:
        linear-gradient(180deg, var(--window-edge), rgba(255,255,255,0.08)),
        linear-gradient(180deg, var(--window-base), rgba(255,255,255,0.12));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), var(--shadow-lg);
      transition: transform .32s var(--ease), box-shadow .32s var(--ease), opacity .28s ease, filter .28s ease;
    }

    .window-shell::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.16);
      pointer-events: none;
    }

    .window-shell.hero {
      width: min(100%, 1160px);
      aspect-ratio: 16 / 9;
    }

    .window-shell.hero::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 38px;
      border: 2px solid rgba(255,255,255,0);
      box-shadow: 0 0 0 0 rgba(160,205,255,0);
      pointer-events: none;
      opacity: 0;
      transition: opacity .26s ease, border-color .26s ease, box-shadow .26s ease;
    }

    .window-shell.hero:not(.is-focused) {
      opacity: .88;
      filter: saturate(.94) brightness(.96);
      transform: scale(.988);
    }

    .window-shell.hero.is-focused::after {
      opacity: 1;
      border-color: rgba(255,255,255,0.82);
      box-shadow: 0 0 0 7px rgba(142,194,255,0.13), 0 0 42px rgba(175,215,255,0.26);
    }

    .window-shell.hero.is-focused .window-media {
      transform: scale(1.035);
    }

    .window-shell.preview {
      aspect-ratio: 0.88 / 1;
    }

    .window-shell.play {
      width: var(--play-stage-width);
      height: var(--play-stage-height);
      max-height: none;
      aspect-ratio: auto;
      padding: 0;
      border-radius: 0;
      background: none;
      box-shadow: none;
    }

    .window-shell.play::before {
      display: none;
    }

    .window-shell:hover,
    .window-shell.is-focused {
      transform: translateY(-3px) scale(1.008);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 42px 96px rgba(0,0,0,0.28), 0 0 0 6px rgba(255,255,255,0.06);
      outline: none;
    }

    .window-shell.play:hover,
    .window-shell.play.is-focused {
      transform: none;
      box-shadow: none;
    }

    .window-shell.play .window-inner {
      border-radius: 0;
      background: none;
      box-shadow: none;
    }

    .window-inner {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 24px;
      background: rgba(0,0,0,0.14);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), inset 0 18px 28px rgba(255,255,255,0.06), inset 0 -40px 80px rgba(0,0,0,0.14);
    }

    .window-media {
      position: absolute;
      inset: 0;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      transform: scale(1.02);
      transition: background-image .4s ease, filter .4s ease, transform 10s linear;
    }

    .window-media::before,
    .window-media::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .window-media::before {
      background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent 24%, transparent 80%, rgba(0,0,0,0.12));
      mix-blend-mode: screen;
    }

    .window-media::after {
      background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.04) 54%, rgba(0,0,0,0.18));
    }

    .window-copy {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 30px 30px;
      pointer-events: none;
    }

    .window-copy.preview-copy {
      justify-content: flex-end;
      padding: 22px 18px 18px;
    }

    .window-copy.play-copy {
      justify-content: flex-start;
      align-items: stretch;
      padding: 86px 34px 34px;
    }

    .window-copy.home-copy {
      justify-content: flex-end;
      gap: 0;
    }

    .favorite-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 3;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.16);
    }

    .favorite-badge svg {
      width: 16px;
      height: 16px;
      fill: #fff;
      stroke: none;
      opacity: 0.96;
    }

    .stage-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: rgba(255,255,255,0.86);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 4;
      transition: transform .24s var(--ease), background .24s ease, opacity .24s ease;
    }

    .stage-arrow.left { left: calc(50% - 646px); }
    .stage-arrow.right { right: calc(50% - 646px); }

    .stage-arrow:hover,
    .stage-arrow:focus-visible {
      transform: translateY(-50%) scale(1.04);
      background: rgba(255,255,255,0.12);
      outline: none;
    }

    .stage-arrow svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .info-embedded {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      width: fit-content;
      max-width: min(70%, 560px);
      padding: 14px 16px 15px;
      border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06)),
        rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.14);
      transition: opacity .34s var(--ease), transform .34s var(--ease), max-width .34s var(--ease), padding .34s var(--ease);
    }

    .window-copy.home-copy .info-embedded {
      background: none;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      padding: 0;
      gap: 10px;
      max-width: none;
    }

    .play-meta-shell {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
      color: rgba(255,255,255,0.96);
      text-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transition: opacity .34s var(--ease), transform .34s var(--ease);
    }

    .play-meta-shell.hidden {
      opacity: 0;
      transform: translateY(-12px) scale(.98);
      pointer-events: none;
    }

    .play-meta-location {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(20px, 2vw, 34px);
      font-weight: 500;
      letter-spacing: 0.06em;
    }

    .play-meta-location svg,
    .play-meta-line svg {
      flex: 0 0 auto;
      fill: none;
      stroke: rgba(255,255,255,0.9);
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .play-meta-location svg {
      width: 18px;
      height: 18px;
    }

    .play-meta-line {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: clamp(14px, 1.1vw, 20px);
      color: rgba(255,255,255,0.86);
    }

    .play-meta-line .dot-sep {
      width: 3px;
      height: 3px;
      background: rgba(255,255,255,0.5);
    }

    .play-meta-line .info-pair {
      gap: 7px;
    }

    .play-meta-line .info-pair svg {
      width: 15px;
      height: 15px;
    }

    .info-embedded.hidden {
      opacity: 0;
      transform: translateY(-10px) scale(.96);
    }

    .window-shell.play.overlay-min .info-embedded,
    .immersive-shell.overlay-min .info-embedded {
      opacity: .72;
      max-width: 180px;
      padding: 10px 12px;
      transform: translateY(-6px);
    }

    .window-shell.play.overlay-min .info-detail,
    .immersive-shell.overlay-min .info-detail,
    .window-shell.play.overlay-min .play-hero,
    .immersive-shell.overlay-min .play-hero,
    .window-shell.play.overlay-min .play-meta-shell,
    .immersive-shell.overlay-min .play-meta-shell {
      opacity: 0;
      transform: translateY(16px);
    }

    .info-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .info-kicker {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.56);
      text-transform: uppercase;
    }

    .info-main {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      color: rgba(255,255,255,0.92);
    }

    .info-main.small {
      font-size: 13px;
      color: rgba(255,255,255,0.78);
      gap: 8px;
    }

    .info-pair {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .info-pair svg {
      width: 14px;
      height: 14px;
      stroke: rgba(255,255,255,0.78);
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .info-main strong {
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .geo-line {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .geo-line svg {
      width: 16px;
      height: 16px;
      stroke: rgba(255,255,255,0.88);
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .dot-sep {

    .scene-category-header.is-collapsed .scene-category-arrow {

    .scene-thumb {

    .scene-info strong {

    .scene-info p {

    .scene-meta-line {

    .mini-tag {

      border: 1px solid rgba(255,255,255,0.08);

      color: rgba(255,255,255,0.74);
      letter-spacing: 0.04em;
    }

    .mini-tag.state {

    .mini-tag.favorite {

    .screensaver-section {

      flex-direction: column;
      gap: 12px;
    }

    .screensaver-section-title {
      padding: 4px 4px 0;

      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.58);
    }

    .screensaver-card {
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 12px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.105), rgba(255,255,255,0.045)),
        rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);

    }

    .screensaver-card:hover,
    .screensaver-card.is-focused,
    .screensaver-card.is-current {

    .screensaver-card .scene-info {
      gap: 7px;
      overflow: hidden;
    }

    .screensaver-card .scene-info strong,
    .screensaver-card .scene-info p,
    .screensaver-card .scene-meta-line,
    .screensaver-card .scene-pills {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-wrap: nowrap;
    }

    .screensaver-card .scene-info strong {
      font-size: 17px;
    }

    .screensaver-card .scene-info p {
      line-height: 1.4;
      margin: 0;
      color: rgba(255,255,255,0.56);
    }

    .screensaver-action {
      min-width: 90px;
      padding: 10px 12px;
      border-radius: 999px;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.92);
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .screensaver-settings {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .screensaver-setting-row {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .screensaver-setting-row strong {
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
    }

    .screensaver-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .screensaver-option {
      padding: 8px 12px;
      border-radius: 999px;
      color: rgba(255,255,255,0.72);
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 12px;
    }

    .screensaver-option.is-active,
    .screensaver-option.is-focused {

      background: rgba(130,180,255,0.18);
      border-color: rgba(160,205,255,0.3);
    }

    .kicker:empty {
      display: none;
    }

    .setting-card {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .setting-card h4 {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .setting-card > p {
      font-size: 13px;
      line-height: 1.75;
      color: var(--text-2);
      margin-top: -6px;
    }

    .setting-card.is-focused {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.16);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.06);
    }

    .season-option {
      padding: 18px;
      border-radius: 22px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      text-align: left;
      transition: transform .24s var(--ease), background .24s ease, border-color .24s ease, box-shadow .24s ease;
    }

    .season-option strong {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .season-option span {
      font-size: 13px;
      line-height: 1.75;
      color: var(--text-2);
    }

    .season-option:hover,
    .season-option.is-current,
    .season-option.is-focused {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.16);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.06);
      outline: none;
    }

    .setting-row.is-focused,
    .range-group.is-focused {
      padding: 10px 10px;
      margin: -10px -10px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .setting-row.disabled {
      opacity: 0.42;
      pointer-events: none;
    }

    .setting-label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .setting-label strong {
      font-size: 15px;
      font-weight: 500;
    }

    .setting-label span {
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-2);
    }

    .switch {
      position: relative;
      width: 58px;
      height: 32px;
      flex: 0 0 auto;
    }

    .switch input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .switch-track {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.12);
      transition: background .24s ease;
    }

    .switch-thumb {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255,255,255,0.96);
      box-shadow: 0 6px 14px rgba(0,0,0,0.2);
      transition: transform .24s var(--ease);
    }

    .switch input:checked + .switch-track {
      background: linear-gradient(135deg, rgba(173,221,255,0.62), rgba(135,196,255,0.48));
    }

    .switch input:checked ~ .switch-thumb {
      transform: translateX(26px);
    }

    .switch.disabled {
      opacity: 0.42;
      pointer-events: none;
    }

    .range-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .range-group.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .range-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 14px;
      color: rgba(255,255,255,0.92);
    }

    .range-note {
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-2);
    }

    .range-group input[type="range"] {
      width: 100%;
      accent-color: #ebf8ff;
    }

    .immersive-view,
    .sleep-view,
    .black-view {
      position: absolute;
      inset: 0;
      z-index: 14;
      display: none;
    }

    .immersive-view.active,
    .sleep-view.active,
    .black-view.active {
      display: flex;
    }

    .immersive-view {
      padding: 24px;
      background:
        linear-gradient(180deg, rgba(6, 12, 18, 0.16), rgba(6, 12, 18, 0.3)),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    }

    .immersive-shell {
      position: relative;
      flex: 1;
      border-radius: 34px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 40px 100px rgba(0,0,0,0.32);
      background: rgba(0,0,0,0.16);
    }

    .immersive-shell .window-media {
      transform: scale(1.06);
    }

    .immersive-controls {
      position: absolute;
      right: 24px;
      bottom: 24px;
      z-index: 2;
      display: flex;
      gap: 12px;
    }

    .ghost-chip {
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 14px;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.92);
    }

    .sleep-view {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 34px;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.06), transparent 34%),
        #020407;
      z-index: 16;
    }

    .sleep-bg {
      position: absolute;
      inset: 0;
      background-position: center;
      background-size: cover;
      opacity: 0.12;
      filter: saturate(0.42) brightness(0.46);
      transform: scale(1.06);
    }

    .sleep-panel,
    .sleep-feed,
    .sleep-hint {
      position: relative;
      z-index: 2;
    }

    .sleep-panel {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .sleep-time {
      font-size: clamp(84px, 12vw, 176px);
      line-height: .92;
      font-weight: 300;
      letter-spacing: -0.04em;
      color: rgba(255,255,255,0.86);
    }

    .sleep-date {
      font-size: 22px;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.68);
    }

    .sleep-meta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 14px;
      color: rgba(255,255,255,0.76);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .sleep-feed {
      width: min(74vw, 980px);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .sleep-card {
      min-height: 124px;
      padding: 18px;
      border-radius: 22px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sleep-card strong {
      font-size: 13px;
      letter-spacing: 0.16em;
      color: rgba(255,255,255,0.44);
      text-transform: uppercase;
    }

    .sleep-card p {
      font-size: 15px;
      line-height: 1.8;
      color: rgba(255,255,255,0.84);
    }

    .sleep-hint {
      color: rgba(255,255,255,0.48);
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .black-view {
      z-index: 17;
      background: #000;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 48px;
    }

    .black-hint {
      color: rgba(255,255,255,0.22);
      font-size: 12px;
      letter-spacing: 0.14em;
    }

    .toast,
    .prompt {
      position: absolute;
      left: 50%;
      transform: translateX(-50%) translateY(18px);
      z-index: 18;
      opacity: 0;
      pointer-events: none;
      transition: opacity .26s var(--ease), transform .26s var(--ease);
    }

    .toast {
      bottom: 36px;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(10, 16, 24, 0.54);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      font-size: 13px;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.94);
    }

    .prompt {
      bottom: 72px;
      min-width: 440px;
      max-width: 70vw;
      padding: 16px 18px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.08)),
        rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.16);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      box-shadow: 0 26px 62px rgba(0,0,0,0.24);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: rgba(255,255,255,0.95);
    }

    .status-badges {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      pointer-events: none;
    }

    .status-badge {
      height: 34px;
      min-width: 34px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 999px;
      background: rgba(12,18,26,0.22);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 10px 24px rgba(0,0,0,0.12);
      color: rgba(255,255,255,0.95);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .status-badge svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .status-badge.screensaver {
      background: rgba(120,164,220,0.22);
      border-color: rgba(170,210,255,0.24);
    }

    .prompt.dark {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04)),
        rgba(8,8,9,0.76);
      border-color: rgba(255,255,255,0.08);
    }

    .toast.show,
    .prompt.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .prompt-copy {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .prompt-title {
      font-size: 15px;
      letter-spacing: 0.04em;
    }

    .prompt-sub {
      font-size: 12px;
      color: rgba(255,255,255,0.64);
      letter-spacing: 0.04em;
    }

    .prompt-count {
      min-width: 42px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.14);
      font-size: 16px;
      font-weight: 600;
    }

    @media (max-width: 1500px) {
      .home-stage {
        grid-template-columns: minmax(84px, 176px) minmax(720px, 1fr) minmax(84px, 176px);
      }

      .preview-slot {
        height: min(48vh, 420px);
      }

      .stage-arrow.left { left: calc(50% - 522px); }
      .stage-arrow.right { right: calc(50% - 522px); }

      .status-chip {
        min-width: 0;
      }

      .play-rail {
        right: calc((100vw - var(--play-stage-width)) / 2 + 14px);
      }

      .rail-btn {
        width: 58px;
        min-width: 58px;
        height: 58px;
      }

      .rail-btn.is-focused,
      .rail-btn:hover {
        width: 158px;
      }

      .home-quick-actions {
        left: calc(100% + 16px);
        top: 5%;
      }

      .home-quick-action {
        width: 128px;
      }
    }

    @media (max-width: 1180px) {
      .shell {
        padding: 26px 24px;
      }

      .home-stage {
        gap: 16px;
        grid-template-columns: minmax(66px, 126px) minmax(560px, 1fr) minmax(66px, 126px);
      }

      .preview-slot {
        height: min(38vh, 320px);
      }

      .stage-arrow.left { left: calc(50% - 404px); }
      .stage-arrow.right { right: calc(50% - 404px); }

      .toolbar {
        gap: 12px;
      }

      .play-view {
        padding: 0;
      }

      .play-rail {
        right: calc((100vw - var(--play-stage-width)) / 2 + 10px);
        gap: 14px;
      }

      .rail-btn {
        width: 54px;
        min-width: 54px;
        height: 54px;
        padding: 0 14px;
      }

      .rail-btn span {
        font-size: 15px;
      }

      .rail-btn.is-focused,
      .rail-btn:hover {
        width: 148px;
      }

      .home-quick-actions {
        left: auto;
        right: 18px;
        top: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="ambient" id="ambient"></div>
    <div class="grain"></div>

    <div class="shell">
      <section class="view home-view active" id="homeView">
        <header class="topbar">
          <div class="brand">
            <svg class="brand-mark" viewBox="0 0 52 72">
              <path d="M8 64V28c0-10 8-18 18-18s18 8 18 18v36H8Z"/>
              <path d="M26 10v54"/>
              <path d="M8 40h36"/>
              <path d="M16 18c2 6 6 10 10 10s8-4 10-10"/>
            </svg>
            <div class="brand-copy">
              <h1>窗景</h1>
              <p>每一扇窗，连接一处真实风景。</p>
            </div>
          </div>

          <div class="toolbar" id="homeToolbar">
            <div class="toolbar-item">
              <button class="icon-btn" data-home-action="screensaver" aria-label="&#23631;&#20445;">
                <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="2.5"/><path d="M8 20h8"/><path d="M12 16v4"/><path d="M15.5 9.5a3.5 3.5 0 1 1-4.9 4.7 4.3 4.3 0 0 0 4.9-4.7Z"/></svg>
              </button>
              <label>&#23631;&#20445;</label>
            </div>

      if ([9, 10, 11].includes(month)) return "\u79cb\u5b63";
      return "\u51ac\u5b63";
    }

    function hourInTimezone(timezone) {
      const hour = new Intl.DateTimeFormat("en-US", { hour: "numeric", hour12: false, timeZone: timezone }).format(new Date());
      return Number(hour);
    }

    function sceneFilter(scene, mode = "home") {
      const weather = currentWeather(scene);
      const hour = hourInTimezone(scene.timezone);
      let brightness = 1;
      let saturate = 1;
      let sepia = 0;
      let hue = 0;

      if (hour < 6 || hour >= 19) {
        brightness = 0.76;
        saturate = 0.88;
        hue = -6;
      } else if (hour < 9) {
        brightness = 1.05;
        saturate = 1.04;
        sepia = 0.06;
      } else if (hour >= 16 && hour < 19) {
        brightness = 1.02;
        saturate = 1.02;
        sepia = 0.08;
      }

      if (weather.weatherText.includes("多云") || weather.weatherText.includes("少云")) {
        brightness -= 0.04;
        saturate -= 0.03;
      }
      if (weather.weatherText.includes("雨") || weather.weatherText.includes("雾")) {
        brightness -= 0.08;
        saturate -= 0.12;
      }

      if (weather.seasonText === "春季") {
        saturate += 0.03;
      }
      if (weather.seasonText === "秋季") {
        sepia += 0.04;
      }
      if (weather.seasonText === "冬季") {
        saturate -= 0.08;
        brightness -= 0.02;
      }

      const visual = sceneVisualState(scene);
      if (mode === "play" && !visual.realtime) {
        const preset = visual.preset || {};
        if (preset.period === "\u6668") { brightness += 0.06; saturate += 0.02; sepia += 0.04; }
        if (preset.period === "\u5348") { brightness += 0.1; saturate += 0.04; }
        if (preset.period === "\u66ae") { brightness -= 0.02; saturate += 0.02; sepia += 0.14; hue -= 8; }
        if (preset.period === "\u591c") { brightness -= 0.34; saturate -= 0.18; hue -= 10; }
        if (preset.weather === "\u9634") { brightness -= 0.08; saturate -= 0.08; }
        if (preset.weather === "\u96e8") { brightness -= 0.14; saturate -= 0.14; hue -= 4; }
        if (preset.weather === "\u96ea") { brightness += 0.07; saturate -= 0.16; sepia -= 0.02; }
        if (preset.season === "\u6625") { saturate += 0.04; hue += 2; }
        if (preset.season === "\u590f") { brightness += 0.04; saturate += 0.08; }
        if (preset.season === "\u79cb") { sepia += 0.1; hue -= 6; }
        if (preset.season === "\u51ac") { brightness -= 0.03; saturate -= 0.12; hue -= 4; }
      }

      brightness = clamp(brightness, 0.42, 1.22);
      saturate = clamp(saturate, 0.48, 1.28);
      sepia = clamp(sepia, 0, 0.36);

      return `brightness(${brightness}) saturate(${saturate}) sepia(${sepia}) hue-rotate(${hue}deg)`;
    }

    function weatherTextFromCode(code) {
      if (code === 0) return "\u6674";
      if ([1].includes(code)) return "\u5927\u90e8\u6674\u6717";
      if ([2].includes(code)) return "\u5c11\u4e91";
      if ([3].includes(code)) return "\u591a\u4e91";
      if ([45, 48].includes(code)) return "\u6709\u96fe";
      if ([51, 53, 55].includes(code)) return "\u6bdb\u6bdb\u96e8";
      if ([61, 63, 65].includes(code)) return "\u5c0f\u96e8";
      if ([71, 73, 75].includes(code)) return "\u96ea";
      if ([80, 81, 82].includes(code)) return "\u9635\u96e8";
      if ([95, 96, 99].includes(code)) return "\u96f7\u96e8";
      return "\u5929\u6c14\u540c\u6b65\u4e2d";
    }

    async function fetchSceneWeather(scene) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${scene.latitude}&longitude=${scene.longitude}&current=temperature_2m,weather_code&timezone=${encodeURIComponent(scene.timezone)}`;
      try {
        const response = await fetch(url);
        const data = await response.json();
        const temp = Math.round(data.current.temperature_2m);
        const weatherText = weatherTextFromCode(data.current.weather_code);
        state.weatherByScene[scene.id] = {
          temperature: `${weatherText} ${temp}°C`,
          weatherText,
          temperatureText: `${temp}°C`,
          timeText: formatSceneTime(scene),
          dateText: formatSceneDate(scene),
          seasonText: seasonForScene(scene)
        };
      } catch (error) {
        console.warn("天气同步失败", scene.id, error);
      }
    }

    async function refreshWeather() {
      await Promise.all(sceneSeeds.map(fetchSceneWeather));
      state.weatherRefreshToken += 1;
      Object.entries(state.visualByScene).forEach(([sceneId, visual]) => {
        const scene = sceneSeeds.find((item) => item.id === sceneId);
        if (scene && visual?.realtime !== false) {
          state.visualByScene[sceneId] = { realtime: true, preset: realtimeVisualPreset(scene) };
        }
      });
      syncCurrentVisualState();
      renderAll();
    }

    function updateTheme() {
      const scene = currentScene();
      document.documentElement.style.setProperty("--bg-top", scene.palette.top);
      document.documentElement.style.setProperty("--bg-bottom", scene.palette.bottom);
      document.documentElement.style.setProperty("--window-base", scene.frame.base);
      document.documentElement.style.setProperty("--window-edge", scene.frame.edge);
      document.body.classList.toggle("reduce-motion", state.settings.reduceMotion);
    }

    function renderWindow(scene, mode) {
      const weather = currentWeather(scene);
      const showInfo = state.settings.showInfo;
      const isHome = mode === "home";
      const isPreview = mode === "preview";
      const isPlay = mode === "play";
      const isWindowContent = scene.group === "window";
      const infoClass = showInfo && !isPreview && isWindowContent ? "info-embedded" : "info-embedded hidden";
      const tags = isHome ? scene.tags.slice(0, 3) : [];
      const previewClass = isPreview ? "preview-copy" : "";
      const homeClass = isHome ? "home-copy" : "";
      const playClass = isPlay ? "play-copy" : "";
      const locationParts = scene.location.split(" · ");
      const geoText = locationParts.length > 1 ? `${locationParts[0]} · ${locationParts.at(-1)}` : scene.location;
      const previewLocation = locationParts.length > 1 ? locationParts.at(-1) : scene.location;
      const statusBadges = !isPlay ? `
        <div class="status-badges">
          ${state.screensaverSceneId === scene.id ? `<div class="status-badge screensaver" aria-label="已设为屏保"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="10" rx="2"/><path d="M9 19h6"/><path d="M12 15v4"/></svg><span>屏保</span></div>` : ""}
          ${state.favorites.has(scene.id) ? `<div class="status-badge favorite" aria-label="已收藏"><svg viewBox="0 0 24 24"><path d="M12 20s-6.5-4.4-8.4-7.2C1.2 9.4 2.6 5.8 6.6 5.3c2-.2 3.5.7 4.4 2 1-1.3 2.5-2.2 4.4-2 4 .5 5.4 4.1 3 7.5C18.5 15.6 12 20 12 20Z"/></svg></div>` : ""}
        </div>
      ` : "";
      const homeInfo = isWindowContent ? `
        <div class="${infoClass}">
          <div class="home-meta-stack">
            <div class="home-location-line">
              <svg viewBox="0 0 24 24"><path d="M12 21s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10Z"/><circle cx="12" cy="11" r="2.4"/></svg>
              <strong>${geoText}</strong>
            </div>
            <div class="home-status-line">
              <span>${weather.seasonText}</span>
              <span class="dot-sep"></span>
              <span class="info-pair">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.8 1.8"/></svg>
                ${weather.timeText}
              </span>
              <span class="dot-sep"></span>
              <span class="info-pair">
                <svg viewBox="0 0 24 24"><path d="M7 16a4 4 0 1 1 1.3-7.8A5 5 0 0 1 18 10a3.5 3.5 0 0 1-.5 6H7Z"/></svg>
                ${weather.weatherText} ${weather.temperatureText}
              </span>
            </div>
          </div>
        </div>
      ` : "";
      const previewFooter = `
        <div class="window-footer preview-footer">
          <div class="preview-copy-block">
            <div class="window-copy-text">
              <div class="preview-meta">
                ${isWindowContent ? `
                  <span>${previewLocation}</span>
                  <span class="dot-sep"></span>
                  <span>${weather.timeText}</span>
                  <span class="dot-sep"></span>
                  <span>${weather.weatherText} ${weather.temperatureText}</span>
                ` : `<span>${scene.shortTitle}</span>`}
              </div>
            </div>
          </div>
        </div>
      `;
      const playInfo = isWindowContent ? `
        <div class="play-meta-shell ${showInfo ? "" : "hidden"}">
          <div class="play-meta-location">
            <svg viewBox="0 0 24 24"><path d="M12 21s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10Z"/><circle cx="12" cy="11" r="2.4"/></svg>
            <strong>${geoText}</strong>
          </div>
          <div class="play-meta-line">
            <span>${weather.seasonText}</span>
            <span class="dot-sep"></span>
            <span class="info-pair">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.8 1.8"/></svg>
              ${weather.timeText}
            </span>
            <span class="dot-sep"></span>
            <span class="info-pair">
              <svg viewBox="0 0 24 24"><path d="M7 16a4 4 0 1 1 1.3-7.8A5 5 0 0 1 18 10a3.5 3.5 0 0 1-.5 6H7Z"/></svg>
              ${weather.weatherText} ${weather.temperatureText}
            </span>
          </div>
        </div>
      ` : "";
      const homeFooter = `
        <div class="window-footer home-footer ${!isWindowContent ? "content-footer" : ""}">
          ${homeInfo}
          <div class="window-tags">
            ${tags.map(tag => `<span class="tag">${tag}</span>`).join("")}
          </div>
        </div>
      `;
      return `
        <div class="window-inner">
          <div class="window-media" style="background-image:url('${scene.image.replace(/'/g, "%27")}');filter:${sceneFilter(scene, mode)}"></div>
          ${statusBadges}
          <div class="window-copy ${previewClass} ${homeClass} ${playClass}">
            ${isPreview ? previewFooter : isHome ? homeFooter : playInfo}
          </div>
        </div>
      `;
    }

    function renderHome() {
      const scene = currentScene();
      const prev = currentScene(-1);
      const next = currentScene(1);
      const items = currentItems();

      el.homeKicker.textContent = "";
      el.homeTitle.textContent = scene.heroTitle || scene.title;
      el.homeDesc.textContent = scene.heroLine || "";

      const animClass = state.sceneTransitionDirection === "left" ? "anim-left" : "anim-right";
      el.prevButton.innerHTML = `<div class="window-shell preview ${animClass}">${renderWindow(prev, "preview")}</div>`;
      el.nextButton.innerHTML = `<div class="window-shell preview ${animClass}">${renderWindow(next, "preview")}</div>`;
      el.heroWindow.classList.remove("anim-left", "anim-right");
      void el.heroWindow.offsetWidth;
      el.heroWindow.classList.add(animClass);
      el.heroWindow.innerHTML = renderWindow(scene, "home");
      if (el.homeFavoriteAction) {
        const isFavorite = state.favorites.has(scene.id);
        const label = isFavorite ? "取消收藏" : "收藏";
        const labelNode = el.homeFavoriteAction.querySelector("span");
        if (labelNode) labelNode.textContent = label;
        el.homeFavoriteAction.setAttribute("aria-label", label);
      }
      if (el.homeScreensaverAction) {
        const isScreensaver = state.screensaverSceneId === scene.id;
        const label = isScreensaver ? "取消屏保" : "设为屏保";
        const labelNode = el.homeScreensaverAction.querySelector("span");
        if (labelNode) labelNode.textContent = label;
        el.homeScreensaverAction.setAttribute("aria-label", label);
      }

      el.sceneDots.innerHTML = items.map((item, index) => `<button class="scene-dot ${index === state.index ? "active" : ""}" data-dot="${index}" aria-label="切换到${item.shortTitle}"></button>`).join("");
      if (el.categoryNav) {
        el.categoryNav.innerHTML = contentCategories.map((category, index) => `
          <button class="category-tab ${category.key === state.categoryKey ? "active" : ""} ${state.homeFocusZone === "categories" && state.categoryFocusIndex === index ? "is-focused" : ""}" data-category="${category.key}" aria-label="切换到${category.label}">
            ${category.label}
          </button>
        `).join("");
      }

      const toolbarButtons = [...el.homeToolbar.querySelectorAll(".icon-btn")];
      toolbarButtons.forEach((button, index) => {
        button.classList.toggle("is-focused", state.homeFocusZone === "toolbar" && state.toolbarIndex === index);
      });
      el.heroWindow.classList.toggle("is-focused", state.homeFocusZone === "hero");
      el.homeQuickActions?.classList.toggle("show", state.homeFocusZone === "hero");
    }

    function renderPlay() {
      const scene = currentScene();
      const isWindowContent = scene.group === "window";
      if (!isWindowContent && state.playFocusZone === "rail") state.playFocusZone = "stage";
      if (!isWindowContent && state.seasonPanelOpen) state.seasonPanelOpen = false;
      el.playWindow.innerHTML = renderWindow(scene, "play");
      el.playWindow.classList.toggle("overlay-min", !state.overlayVisible);
      el.playView.classList.toggle("overlay-min", !state.overlayVisible);
      el.playView.classList.toggle("entering", state.playOpening);
      el.playView.classList.toggle("scene-fading", state.sceneFading);
      el.playView.classList.toggle("season-panel-open", state.seasonPanelOpen);
      el.playWindow.classList.toggle("is-focused", state.playFocusZone === "stage");
      el.playRail.classList.toggle("content-hidden", !isWindowContent);
      const railButtons = [...el.playRail.querySelectorAll(".rail-btn")];
      railButtons.forEach((button, index) => {
        button.classList.toggle("is-focused", state.playFocusZone === "rail" && state.railIndex === index);
      });
      renderSeasonPanel();
      updateStatus();
    }

    function renderImmersive() {
      const scene = currentScene();
      el.immersiveShell.innerHTML = renderWindow(scene, "play");
      el.immersiveShell.classList.toggle("overlay-min", !state.overlayVisible);
    }

    function renderSeasonPanel() {
      if (!el.seasonPanel) return;
      el.seasonPanel.classList.toggle("open", state.seasonPanelOpen);
      const controls = seasonPanelControls();
      controls.forEach((button, index) => {
        const type = button.dataset.seasonType;
        button.classList.toggle("is-active", !!type && state.visualPreset?.[type] === button.dataset.seasonValue);
        button.classList.toggle("is-focused", state.seasonPanelOpen && index === state.seasonFocusIndex);
      });
    }

    function renderSleep() {
      const scene = currentScene();
      const weather = currentWeather(scene);
      el.sleepBg.style.backgroundImage = `url('${scene.image.replace(/'/g, "%27")}')`;
      el.sleepTime.textContent = weather.timeText;
      el.sleepDate.textContent = weather.dateText;
      el.sleepMeta.innerHTML = `
        <span>${scene.location}</span>
        <span class="dot-sep"></span>
        <span>${weather.weatherText} ${weather.temperatureText}</span>
        <span class="dot-sep"></span>
        <span>${weather.seasonText}</span>
      `;
      el.sleepFeed.innerHTML = [
        { title: "消息通知", text: `${scene.shortTitle} 当前窗景已切换至低功耗显示，仍保持在地信息同步。` },
        { title: "影视新闻", text: "今日推荐：在大屏上观看自然风景类内容时，用户更偏好轻量信息与低干扰界面。" },
        { title: "在地资讯", text: `${scene.location} 当前天气为 ${weather.weatherText}，适合继续保留该窗景作为空间氛围背景。` }
      ].map(item => `
        <div class="sleep-card">
          <strong>${item.title}</strong>
          <p>${item.text}</p>
        </div>
      `).join("");
    }

    function renderAll() {
      updateTheme();
      renderHome();
      renderPlay();
      renderImmersive();
      renderSleep();
      if (state.drawer) renderDrawer();
      refreshAutoplay();
    }

    function refreshVisibleTimeOnly() {
      if (state.page === "sleep") {
        renderSleep();
        return;
      }

      if (state.page === "play" || state.page === "immersive") {
        updateStatus();
      }
    }

    function setScene(index, announce = false) {
      const items = currentItems();
      state.sceneTransitionDirection = index > state.index || (state.index === items.length - 1 && index === 0) ? "right" : "left";
      state.index = (index + items.length) % items.length;
      syncCurrentVisualState();
      renderAll();
      persist();
    }

    function switchSceneWithFade(index) {
      if (state.sceneFading) return;
      const items = currentItems();
      state.sceneTransitionDirection = index > state.index || (state.index === items.length - 1 && index === 0) ? "right" : "left";
      state.sceneFading = true;
      state.seasonPanelOpen = false;
      renderPlay();
      setTimeout(() => {
        state.index = (index + items.length) % items.length;
        syncCurrentVisualState();
        persist();
        renderAll();
        setTimeout(() => {
          state.sceneFading = false;
          renderPlay();
          wakeOverlay();
        }, state.settings.reduceMotion ? 40 : 320);
      }, state.settings.reduceMotion ? 40 : 360);
    }

    function openSeasonPanel() {
      state.seasonPanelOpen = true;
      state.seasonFocusIndex = 0;
      state.overlayVisible = true;
      clearTimeout(state.overlayTimer);
      renderPlay();
    }

    function closeSeasonPanel() {
      if (!state.seasonPanelOpen) return;
      state.seasonPanelOpen = false;
      renderPlay();
      wakeOverlay();
    }

    function applySeasonChoice(type, value) {
      const scene = currentScene();
      const visual = sceneVisualState(scene);
      saveSceneVisualState(scene, {
        realtime: false,
        preset: { ...visual.preset, [type]: value }
      });
      persist();
      renderPlay();
    }

    function randomizeSeasonPanel() {
      const pick = (items) => items[Math.floor(Math.random() * items.length)];
      const scene = currentScene();
      saveSceneVisualState(scene, {
        realtime: false,
        preset: {
          season: pick(["\u6625", "\u590f", "\u79cb", "\u51ac"]),
          weather: pick(["\u9634", "\u6674", "\u96e8", "\u96ea"]),
          period: pick(["\u6668", "\u5348", "\u66ae", "\u591c"])
        }
      });
      persist();
      renderPlay();
    }

    function realtimeVisualPreset(scene = currentScene()) {
      const month = monthInTimezone(scene.timezone);
      const hour = hourInTimezone(scene.timezone);
      const weather = currentWeather(scene).weatherText || "";
      let season = "\u51ac";
      let weatherValue = "\u6674";
      let period = "\u5348";

      if ([3, 4, 5].includes(month)) season = "\u6625";
      if ([6, 7, 8].includes(month)) season = "\u590f";
      if ([9, 10, 11].includes(month)) season = "\u79cb";

      if (hour < 6 || hour >= 19) period = "\u591c";
      else if (hour < 10) period = "\u6668";
      else if (hour >= 16) period = "\u66ae";

      if (weather.includes("\u96e8") || weather.includes("雨")) weatherValue = "\u96e8";
      else if (weather.includes("\u96ea") || weather.includes("雪")) weatherValue = "\u96ea";
      else if (
        weather.includes("\u9634") ||
        weather.includes("\u4e91") ||
        weather.includes("阴") ||
        weather.includes("云")
      ) weatherValue = "\u9634";

      return { season, weather: weatherValue, period };
    }

    function resetSeasonPanelToRealtime() {
      const scene = currentScene();
      saveSceneVisualState(scene, { realtime: true, preset: realtimeVisualPreset(scene) });
      persist();
      renderPlay();
    }

    function seasonPanelControls() {
      return el.seasonPanel ? [...el.seasonPanel.querySelectorAll("#seasonRandom, #seasonReset, [data-season-type]")] : [];
    }

    function setSeasonPanelFocus(index) {
      const controls = seasonPanelControls();
      if (!controls.length) return;
      state.seasonFocusIndex = (index + controls.length) % controls.length;
      renderSeasonPanel();
    }

    function triggerSeasonPanelControl() {
      const control = seasonPanelControls()[state.seasonFocusIndex];
      if (!control) return;
      if (control.id === "seasonRandom") {
        randomizeSeasonPanel();
        return;
      }
      if (control.id === "seasonReset") {
        resetSeasonPanelToRealtime();
        return;
      }
      applySeasonChoice(control.dataset.seasonType, control.dataset.seasonValue);
    }

    function showToast(text) {
      el.toast.textContent = text;
      el.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => el.toast.classList.remove("show"), 1800);
    }

    function openDrawer(type) {
      state.drawer = type;
      state.drawerFocusIndex = 0;
      renderDrawer();
      el.drawer.classList.add("open");
      el.drawerMask.classList.add("open");
      refreshAutoplay();
    }

    function closeDrawer() {
      state.drawer = null;
      el.drawer.classList.remove("open");
      el.drawerMask.classList.remove("open");
      refreshAutoplay();
    }

    function renderDrawer() {
      if (!state.drawer) {
        el.drawer.innerHTML = "";
        return;
      }

      if (state.drawer === "screensaver") {
        const activeScene = screensaverScene();
        const current = currentScene();
        const currentIsScreensaver = state.screensaverSceneId === current.id;
        let drawerIndex = 0;
        const sceneCard = (scene, role, reason = "") => {
          const weather = currentWeather(scene);
          const meta = sceneListMeta(scene);
          const isActive = state.screensaverSceneId === scene.id;
          const action = isActive ? "unset" : "set";
          const metaLine = scene.group === "window"
            ? `<span>${meta.location}</span><span class="dot-sep"></span><span>${weather.seasonText}</span><span class="dot-sep"></span><span>${weather.timeText}</span><span class="dot-sep"></span><span>${weather.weatherText} ${weather.temperatureText}</span>`
            : `<span>${scene.groupLabel || "\u5185\u5bb9"}</span><span class="dot-sep"></span><span>${scene.description || scene.detail || ""}</span>`;
          return `
            <button class="screensaver-card ${isActive ? "is-current" : ""}" data-drawer-index="${drawerIndex++}" data-screensaver-action="${action}" data-scene-id="${scene.id}">
              <div class="scene-thumb" style="--thumb-base:${scene.frame.base};--thumb-edge:${scene.frame.edge};">
                <div class="scene-thumb-inner" style="background-image:url('${scene.image.replace(/'/g, "%27")}')"></div>
              </div>
              <div class="scene-info">
                <strong>${meta.title}</strong>
                <div class="scene-meta-line">
                  ${metaLine}
                </div>
                <p>${reason || (role === "active" ? "\u65e0\u64cd\u4f5c\u540e\u4f18\u5148\u8fdb\u5165\u6b64\u5185\u5bb9\u5c4f\u4fdd" : recommendationReason(scene))}</p>
                <div class="scene-pills">
                  ${isActive ? `<span class="mini-tag state">\u5c4f\u4fdd\u4e2d</span>` : ""}
                  ${meta.tags.map(tag => `<span class="mini-tag">${tag}</span>`).join("")}
                </div>
              </div>
              <span class="screensaver-action">${isActive ? "\u53d6\u6d88\u5c4f\u4fdd" : "\u8bbe\u4e3a\u5c4f\u4fdd"}</span>
            </button>
          `;
        };
        const settingOption = (type, value, active) => `
          <button class="screensaver-option ${active ? "is-active" : ""}" data-drawer-index="${drawerIndex++}" data-screensaver-setting="${type}" data-screensaver-value="${value}">
            ${screensaverSettingLabel(type, value)}
          </button>
        `;

        el.drawer.innerHTML = `
          <div class="drawer-head">
            <div class="drawer-head-row">
              <h3>\u5c4f\u4fdd\u4e2d\u5fc3</h3>
              <button class="drawer-close" data-close-drawer aria-label="\u5173\u95ed">
                <svg viewBox="0 0 24 24"><path d="M6 6 18 18"/><path d="M18 6 6 18"/></svg>
              </button>
            </div>
            <p>\u7edf\u4e00\u7ba1\u7406\u5c4f\u4fdd\u5185\u5bb9\u3001\u4eca\u65e5\u63a8\u8350\u548c\u5c4f\u4fdd\u542f\u52a8\u89c4\u5219\u3002</p>
          </div>
          <div class="drawer-body">
            <section class="screensaver-section">
              <div class="screensaver-section-title">\u5f53\u524d\u5c4f\u4fdd</div>
              ${activeScene ? sceneCard(activeScene, "active") : `
                <div class="setting-card">
                  <h4>\u5c1a\u672a\u8bbe\u7f6e\u5c4f\u4fdd</h4>
                  <p>\u53ef\u5c06\u5f53\u524d\u5185\u5bb9\u6216\u4eca\u65e5\u63a8\u8350\u4e00\u952e\u8bbe\u4e3a\u5c4f\u4fdd\u3002</p>
                </div>
              `}
              ${currentIsScreensaver ? "" : sceneCard(current, "current", "\u5f53\u524d\u6b63\u5728\u6d4f\u89c8\u7684\u5185\u5bb9\uff0c\u53ef\u4e00\u952e\u66ff\u6362\u4e3a\u5c4f\u4fdd")}
            </section>
            <section class="screensaver-section">
              <div class="screensaver-section-title">\u4eca\u65e5\u63a8\u8350</div>
              ${recommendedScreensaverScenes().map(scene => sceneCard(scene, "recommend")).join("")}
            </section>
            <section class="screensaver-section">
              <div class="screensaver-section-title">\u5c4f\u4fdd\u8bbe\u7f6e</div>
              <div class="screensaver-settings">
                <div class="screensaver-setting-row">
                  <strong>\u542f\u52a8\u65f6\u95f4</strong>
                  <div class="screensaver-options">
                    ${[1, 3, 5, 10].map(value => settingOption("start", value, state.settings.screensaverStartTime === value)).join("")}
                  </div>
                </div>
                <div class="screensaver-setting-row">
                  <strong>\u64ad\u653e\u6a21\u5f0f</strong>
                  <div class="screensaver-options">
                    ${["fixed", "favorites", "recommended"].map(value => settingOption("mode", value, state.settings.screensaverPlayMode === value)).join("")}
                  </div>
                </div>
                <div class="screensaver-setting-row">
                  <strong>\u4fe1\u606f\u663e\u793a</strong>
                  <div class="screensaver-options">
                    ${["auto", "always", "hidden"].map(value => settingOption("info", value, state.settings.screensaverInfoMode === value)).join("")}
                  </div>
                </div>
              </div>
            </section>
          </div>
        `;
        requestAnimationFrame(() => setDrawerFocus(state.drawerFocusIndex));
        return;
      }

      if (state.drawer === "menu") {
        let drawerIndex = 0;
        const listSections = contentCategories.map((category) => {
          const groupItems = sceneSeeds.filter((scene) => scene.group === category.key);
          if (!groupItems.length) return "";
          const collapsed = !!state.collapsedGroups[category.key];
          const header = `
            <button class="scene-category-header ${collapsed ? "is-collapsed" : ""}" data-drawer-index="${drawerIndex++}" data-category-toggle="${category.key}" aria-label="${collapsed ? "展开" : "收起"}${category.label}">
              <span class="scene-category-title">${category.label}<span class="scene-category-count">${groupItems.length}</span></span>
              <span class="scene-category-arrow"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>
            </button>
          `;
          if (collapsed) return header;
          const items = groupItems.map((scene) => {
            const weather = currentWeather(scene);
            const meta = sceneListMeta(scene);
            const favorite = state.favorites.has(scene.id);
            const isScreensaver = state.screensaverSceneId === scene.id;
            const isCurrent = scene.id === currentScene().id;
            const currentLabel = isCurrent ? '<span class="mini-tag state">\u5f53\u524d</span>' : '';
            const metaLine = scene.group === "window"

        el.drawer.innerHTML = `

      if (state.drawer === "season") {

        el.drawer.innerHTML = `

      el.drawer.innerHTML = `

              <label class="switch">
                <input type="checkbox" data-setting="reduceMotion" ${state.settings.reduceMotion ? "checked" : ""}/>
