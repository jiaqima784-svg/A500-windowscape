<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A500 窗景 Demo</title>
  <style>
    :root {
      --bg-top: #d8ded9;
      --bg-bottom: #7c8d93;
      --accent: #d9ecef;
      --text: rgba(255, 255, 255, 0.98);
      --text-2: rgba(255, 255, 255, 0.78);
      --text-3: rgba(255, 255, 255, 0.52);
      --panel: rgba(255, 255, 255, 0.12);
      --line: rgba(255, 255, 255, 0.16);
      --shadow-lg: 0 36px 90px rgba(0, 0, 0, 0.24);
      --shadow-md: 0 18px 40px rgba(0, 0, 0, 0.18);
      --ease: cubic-bezier(.22, .82, .2, 1);
      --window-base: rgba(242, 236, 227, 0.52);
      --window-edge: rgba(255, 255, 255, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "SF Pro Display", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 16%, rgba(255, 255, 255, 0.26), transparent 18%),
        radial-gradient(circle at 84% 14%, rgba(255, 237, 210, 0.22), transparent 16%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    }

    body.reduce-motion *,
    body.reduce-motion *::before,
    body.reduce-motion *::after {
      animation: none !important;
      transition-duration: 0.01ms !important;
    }

    button,
    input {
      font: inherit;
      color: inherit;
    }

    button {
      border: none;
      background: none;
      cursor: pointer;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      isolation: isolate;
    }

    .ambient {
      position: absolute;
      inset: -8%;
      z-index: 0;
      filter: blur(32px) saturate(1.04);
      transform: scale(1.08);
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.18), transparent 34%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      transition: background .5s var(--ease);
    }

    .ambient::before,
    .ambient::after {
      content: "";
      position: absolute;
      inset: 0;
    }

    .ambient::before {
      background:
        radial-gradient(circle at 20% 22%, rgba(255,255,255,0.14), transparent 18%),
        radial-gradient(circle at 80% 18%, rgba(255,248,235,0.18), transparent 16%),
        linear-gradient(180deg, rgba(10, 18, 28, 0.04), rgba(10, 18, 28, 0.18));
    }

    .ambient::after {
      background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent 28%, transparent 74%, rgba(255,255,255,0.04));
      mix-blend-mode: screen;
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.12;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.26) 0 1px, transparent 1px),
        radial-gradient(circle at 72% 64%, rgba(255,255,255,.18) 0 1px, transparent 1px);
      background-size: 220px 220px, 280px 280px;
    }

    .shell {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 34px 42px;
      display: flex;
      flex-direction: column;
    }

    .view {
      display: none;
      width: 100%;
      height: 100%;
    }

    .view.active {
      display: flex;
    }

    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: flex-start;
      gap: 18px;
    }

    .brand-mark {
      width: 52px;
      height: 72px;
      stroke: rgba(255,255,255,0.92);
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.92;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .brand-copy h1 {
      font-size: 34px;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .brand-copy p {
      font-size: 13px;
      line-height: 1.7;
      color: rgba(255,255,255,0.68);
      max-width: 300px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .toolbar-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .toolbar-item label {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.74);
    }

    .icon-btn {
      position: relative;
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(16px) saturate(130%);
      -webkit-backdrop-filter: blur(16px) saturate(130%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), var(--shadow-md);
      transition: transform .24s var(--ease), background .24s ease, box-shadow .24s ease;
    }

    .icon-btn:hover,
    .icon-btn:focus-visible,
    .icon-btn.is-focused {
      transform: translateY(-2px) scale(1.03);
      background: rgba(255,255,255,0.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 20px 48px rgba(0,0,0,0.22), 0 0 0 5px rgba(255,255,255,0.08);
      outline: none;
    }

    .icon-btn svg,
    .drawer-close svg,
    .chip svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .home-view {
      flex-direction: column;
    }

    .home-stage {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(120px, 220px) minmax(900px, 1fr) minmax(120px, 220px);
      gap: 24px;
      align-items: center;
      perspective: 1200px;
      position: relative;
    }

    .preview-slot {
      position: relative;
      height: min(56vh, 520px);
      opacity: 0.84;
      transition: opacity .28s ease, transform .36s var(--ease);
    }

    .preview-slot.left { transform: translateX(-18px) rotateY(9deg); }
    .preview-slot.right { transform: translateX(18px) rotateY(-9deg); }
    .preview-slot:hover { opacity: 1; }

    .hero-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      min-width: 0;
    }

    .hero-title-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .hero-title-group .kicker {
      font-size: 12px;
      letter-spacing: 0.24em;
      color: var(--text-3);
      text-transform: uppercase;
    }

    .hero-title-group h2 {
      font-size: clamp(38px, 3.4vw, 54px);
      font-weight: 400;
      letter-spacing: 0.12em;
      font-family: "STKaiti", "KaiTi", "Noto Serif SC", "Songti SC", serif;
      text-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .hero-title-group p {
      font-size: 12px;
      line-height: 1.7;
      color: rgba(255,255,255,0.58);
      max-width: 380px;
    }

    .window-shell {
      position: relative;
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      background:
        linear-gradient(180deg, var(--window-edge), rgba(255,255,255,0.08)),
        linear-gradient(180deg, var(--window-base), rgba(255,255,255,0.12));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), var(--shadow-lg);
      transition: transform .32s var(--ease), box-shadow .32s var(--ease);
    }

    .window-shell::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.16);
      pointer-events: none;
    }

    .window-shell.hero {
      width: min(100%, 1160px);
      aspect-ratio: 16 / 9;
    }

    .window-shell.preview {
      aspect-ratio: 0.88 / 1;
    }

    .window-shell.play {
      width: var(--play-stage-width);
      height: var(--play-stage-height);
      max-height: none;
      aspect-ratio: auto;
      padding: 0;
      border-radius: 0;
      background: none;
      box-shadow: none;
    }

    .window-shell.play::before {
      display: none;
    }

    .window-shell:hover,
    .window-shell.is-focused {
      transform: translateY(-3px) scale(1.008);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 42px 96px rgba(0,0,0,0.28), 0 0 0 6px rgba(255,255,255,0.06);
      outline: none;
    }

    .window-shell.play:hover,
    .window-shell.play.is-focused {
      transform: none;
      box-shadow: none;
    }

    .window-shell.play .window-inner {
      border-radius: 0;
      background: none;
      box-shadow: none;
    }

    .window-inner {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 24px;
      background: rgba(0,0,0,0.14);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), inset 0 18px 28px rgba(255,255,255,0.06), inset 0 -40px 80px rgba(0,0,0,0.14);
    }

    .window-media {
      position: absolute;
      inset: 0;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      transform: scale(1.02);
      transition: background-image .4s ease, filter .4s ease, transform 10s linear;
    }

    .window-media::before,
    .window-media::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .window-media::before {
      background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent 24%, transparent 80%, rgba(0,0,0,0.12));
      mix-blend-mode: screen;
    }

    .window-media::after {
      background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.04) 54%, rgba(0,0,0,0.18));
    }

    .window-copy {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 30px 30px;
      pointer-events: none;
    }

    .window-copy.preview-copy {
      justify-content: flex-end;
      padding: 22px 18px 18px;
    }

    .window-copy.play-copy {
      justify-content: flex-start;
      align-items: stretch;
      padding: 86px 34px 34px;
    }

    .window-copy.home-copy {
      justify-content: flex-end;
      gap: 0;
    }

    .favorite-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 3;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.16);
    }

    .favorite-badge svg {
      width: 16px;
      height: 16px;
      fill: #fff;
      stroke: none;
      opacity: 0.96;
    }

    .stage-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: rgba(255,255,255,0.86);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 4;
      transition: transform .24s var(--ease), background .24s ease, opacity .24s ease;
    }

    .stage-arrow.left { left: calc(50% - 646px); }
    .stage-arrow.right { right: calc(50% - 646px); }

    .stage-arrow:hover,
    .stage-arrow:focus-visible {
      transform: translateY(-50%) scale(1.04);
      background: rgba(255,255,255,0.12);
      outline: none;
    }

    .stage-arrow svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .info-embedded {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      width: fit-content;
      max-width: min(70%, 560px);
      padding: 14px 16px 15px;
      border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06)),
        rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.14);
      transition: opacity .34s var(--ease), transform .34s var(--ease), max-width .34s var(--ease), padding .34s var(--ease);
    }

    .window-copy.home-copy .info-embedded {
      background: none;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      padding: 0;
      gap: 10px;
      max-width: none;
    }

    .play-meta-shell {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
      color: rgba(255,255,255,0.96);
      text-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transition: opacity .34s var(--ease), transform .34s var(--ease);
    }

    .play-meta-shell.hidden {
      opacity: 0;
      transform: translateY(-12px) scale(.98);
      pointer-events: none;
    }

    .play-meta-location {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(20px, 2vw, 34px);
      font-weight: 500;
      letter-spacing: 0.06em;
    }

    .play-meta-location svg,
    .play-meta-line svg {
      flex: 0 0 auto;
      fill: none;
      stroke: rgba(255,255,255,0.9);
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .play-meta-location svg {
      width: 18px;
      height: 18px;
    }

    .play-meta-line {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: clamp(14px, 1.1vw, 20px);
      color: rgba(255,255,255,0.86);
    }

    .play-meta-line .dot-sep {
      width: 3px;
      height: 3px;
      background: rgba(255,255,255,0.5);
    }

    .play-meta-line .info-pair {
      gap: 7px;
    }

    .play-meta-line .info-pair svg {
      width: 15px;
      height: 15px;
    }

    .info-embedded.hidden {
      opacity: 0;
      transform: translateY(-10px) scale(.96);
    }

    .window-shell.play.overlay-min .info-embedded,
    .immersive-shell.overlay-min .info-embedded {
      opacity: .72;
      max-width: 180px;
      padding: 10px 12px;
      transform: translateY(-6px);
    }

    .window-shell.play.overlay-min .info-detail,
    .immersive-shell.overlay-min .info-detail,
    .window-shell.play.overlay-min .play-hero,
    .immersive-shell.overlay-min .play-hero,
    .window-shell.play.overlay-min .play-meta-shell,
    .immersive-shell.overlay-min .play-meta-shell {
      opacity: 0;
      transform: translateY(16px);
    }

    .info-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .info-kicker {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.56);
      text-transform: uppercase;
    }

    .info-main {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      color: rgba(255,255,255,0.92);
    }

    .info-main.small {
      font-size: 13px;
      color: rgba(255,255,255,0.78);
      gap: 8px;
    }

    .info-pair {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .info-pair svg {
      width: 14px;
      height: 14px;
      stroke: rgba(255,255,255,0.78);
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .info-main strong {
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .geo-line {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .geo-line svg {
      width: 16px;
      height: 16px;
      stroke: rgba(255,255,255,0.88);
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .dot-sep {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.42);
    }

    .window-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }

    .window-footer.home-footer {
      align-items: flex-end;
      justify-content: space-between;
    }

    .window-footer.preview-footer {
      justify-content: center;
      align-items: flex-end;
    }

    .window-copy-text {
      max-width: 50%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: opacity .34s var(--ease), transform .34s var(--ease);
    }

    .window-copy-text h3 {
      font-size: clamp(26px, 2.4vw, 38px);
      font-weight: 420;
      letter-spacing: 0.14em;
      font-family: "STKaiti", "KaiTi", "Noto Serif SC", "Songti SC", serif;
      text-shadow: 0 10px 28px rgba(0,0,0,0.16);
    }

    .window-copy-text p {
      font-size: 13px;
      line-height: 1.7;
      color: rgba(255,255,255,0.76);
      max-width: 420px;
    }

    .window-tags {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 28%;
      transition: opacity .34s var(--ease), transform .34s var(--ease);
    }

    .tag {
      padding: 9px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 12px;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .preview-slot .window-copy {
      padding: 20px 18px 18px;
    }

    .preview-slot .window-copy-text {
      max-width: 100%;
      gap: 6px;
      justify-content: flex-end;
      align-items: center;
      text-align: center;
    }

    .preview-slot .window-copy-text h3 {
      font-size: 15px;
      letter-spacing: 0.08em;
      opacity: 0.96;
      font-weight: 520;
      text-shadow: 0 6px 18px rgba(0,0,0,0.18);
    }

    .preview-slot .window-tags {
      display: none;
    }

    .preview-slot .window-copy-text p {
      display: none;
    }

    .preview-meta {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      line-height: 1.45;
      text-shadow: 0 4px 14px rgba(0,0,0,0.2);
    }

    .preview-meta .dot-sep {
      width: 3px;
      height: 3px;
      background: rgba(255,255,255,0.34);
    }

    .preview-copy-block {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 12px 12px 4px;
      background: linear-gradient(180deg, rgba(8,14,20,0), rgba(8,14,20,0.16) 26%, rgba(8,14,20,0.3));
      border-radius: 0 0 18px 18px;
    }

    .home-meta-stack {
      display: flex;
      flex-direction: column;
      gap: 7px;
      color: rgba(255,255,255,0.92);
      text-shadow: 0 6px 20px rgba(0,0,0,0.16);
    }

    .home-location-line,
    .home-status-line {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .home-location-line {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .home-status-line {
      font-size: 13px;
      color: rgba(255,255,255,0.8);
    }

    .home-status-line .dot-sep {
      background: rgba(255,255,255,0.3);
    }

    .home-meta-stack svg {
      width: 14px;
      height: 14px;
      stroke: rgba(255,255,255,0.82);
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .window-shell.anim-left {
      animation: cardLeftIn .42s var(--ease);
    }

    .window-shell.anim-right {
      animation: cardRightIn .42s var(--ease);
    }

    @keyframes cardLeftIn {
      0% { opacity: .0; transform: translateX(42px) scale(.97); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes cardRightIn {
      0% { opacity: .0; transform: translateX(-42px) scale(.97); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    .scene-dots {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .scene-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;

        index: state.index,
        settings: state.settings,
        screensaverSceneId: state.screensaverSceneId,
        favorites: [...state.favorites]
      }));
    }

    function loadPersisted() {
      try {
        const raw = localStorage.getItem(storageKey);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (typeof data.index === "number") state.index = data.index % sceneSeeds.length;
        if (data.settings) state.settings = { ...state.settings, ...data.settings };
        if (typeof data.screensaverSceneId === "string") state.screensaverSceneId = data.screensaverSceneId;
        if (Array.isArray(data.favorites)) state.favorites = new Set(data.favorites);
      } catch (error) {
        console.warn("读取本地状态失败", error);
      }
      normalizeSettings();
    }

    function normalizeSettings() {
      if (!state.settings.allowSleep) state.settings.allowBlack = false;
      state.settings.autoplayInterval = clamp(state.settings.autoplayInterval, 8, 30);
      state.settings.sleepTimeout = clamp(state.settings.sleepTimeout, 20, 180);
      state.settings.blackTimeout = clamp(state.settings.blackTimeout, 30, 300);
    }

    function currentScene(offset = 0) {
      const index = (state.index + offset + sceneSeeds.length) % sceneSeeds.length;
      return sceneSeeds[index];
    }

    function currentWeather(scene = currentScene()) {
      return state.weatherByScene[scene.id] || {
        temperature: scene.fallbackWeather,
        weatherText: scene.fallbackWeather.split(" ").slice(0, -1).join(" ") || scene.fallbackWeather,
        temperatureText: scene.fallbackWeather.split(" ").at(-1) || "",
        timeText: formatSceneTime(scene),
        dateText: formatSceneDate(scene),
        seasonText: seasonForScene(scene)
      };
    }

    function formatSceneTime(scene) {
      return new Intl.DateTimeFormat("zh-CN", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
        timeZone: scene.timezone
      }).format(new Date());
    }

    function formatSceneDate(scene) {
      return new Intl.DateTimeFormat("zh-CN", {
        month: "long",
        day: "numeric",
        weekday: "long",
        timeZone: scene.timezone
      }).format(new Date());
    }

    function monthInTimezone(timezone) {
      const month = new Intl.DateTimeFormat("en-US", { month: "numeric", timeZone: timezone }).format(new Date());
      return Number(month);
    }

    function seasonForScene(scene) {
      const month = monthInTimezone(scene.timezone);
      if ([3, 4, 5].includes(month)) return "春季";
      if ([6, 7, 8].includes(month)) return "夏季";
      if ([9, 10, 11].includes(month)) return "秋季";
      return "冬季";
    }

    function hourInTimezone(timezone) {
      const hour = new Intl.DateTimeFormat("en-US", { hour: "numeric", hour12: false, timeZone: timezone }).format(new Date());
      return Number(hour);
    }

    function sceneFilter(scene) {
      const weather = currentWeather(scene);
      const hour = hourInTimezone(scene.timezone);
      let brightness = 1;
      let saturate = 1;
      let sepia = 0;
      let hue = 0;

      if (hour < 6 || hour >= 19) {
        brightness = 0.76;
        saturate = 0.88;
        hue = -6;
      } else if (hour < 9) {
        brightness = 1.05;
        saturate = 1.04;
        sepia = 0.06;
      } else if (hour >= 16 && hour < 19) {
        brightness = 1.02;
        saturate = 1.02;
        sepia = 0.08;
      }

      if (weather.weatherText.includes("多云") || weather.weatherText.includes("少云")) {
        brightness -= 0.04;
        saturate -= 0.03;
      }
      if (weather.weatherText.includes("雨") || weather.weatherText.includes("雾")) {
        brightness -= 0.08;
        saturate -= 0.12;
      }

      if (weather.seasonText === "春季") {
        saturate += 0.03;
      }
      if (weather.seasonText === "秋季") {
        sepia += 0.04;
      }
      if (weather.seasonText === "冬季") {
        saturate -= 0.08;
        brightness -= 0.02;
      }

      return `brightness(${brightness}) saturate(${saturate}) sepia(${sepia}) hue-rotate(${hue}deg)`;
    }

    function weatherTextFromCode(code) {
      if (code === 0) return "晴";
      if ([1].includes(code)) return "大部晴朗";
      if ([2].includes(code)) return "少云";
      if ([3].includes(code)) return "多云";
      if ([45, 48].includes(code)) return "雾";
      if ([51, 53, 55].includes(code)) return "毛毛雨";
      if ([61, 63, 65].includes(code)) return "小雨";
      if ([71, 73, 75].includes(code)) return "雪";
      if ([80, 81, 82].includes(code)) return "阵雨";
      if ([95, 96, 99].includes(code)) return "雷雨";
      return "天气同步中";
    }

    async function fetchSceneWeather(scene) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${scene.latitude}&longitude=${scene.longitude}&current=temperature_2m,weather_code&timezone=${encodeURIComponent(scene.timezone)}`;
      try {
        const response = await fetch(url);
        const data = await response.json();
        const temp = Math.round(data.current.temperature_2m);
        const weatherText = weatherTextFromCode(data.current.weather_code);
        state.weatherByScene[scene.id] = {
          temperature: `${weatherText} ${temp}°C`,
          weatherText,
          temperatureText: `${temp}°C`,
          timeText: formatSceneTime(scene),
          dateText: formatSceneDate(scene),
          seasonText: seasonForScene(scene)
        };
      } catch (error) {
        console.warn("天气同步失败", scene.id, error);
      }
    }

      const playClass = isPlay ? "play-copy" : "";
      const locationParts = scene.location.split(" · ");
      const geoText = locationParts.length > 1 ? `${locationParts[0]} · ${locationParts.at(-1)}` : scene.location;
      const previewLocation = locationParts.length > 1 ? locationParts.at(-1) : scene.location;
      const favoriteBadge = !isPlay && state.favorites.has(scene.id)
        ? `<div class="favorite-badge" aria-label="已收藏"><svg viewBox="0 0 24 24"><path d="M12 20s-6.5-4.4-8.4-7.2C1.2 9.4 2.6 5.8 6.6 5.3c2-.2 3.5.7 4.4 2 1-1.3 2.5-2.2 4.4-2 4 .5 5.4 4.1 3 7.5C18.5 15.6 12 20 12 20Z"/></svg></div>`
        : "";
      const homeInfo = `
        <div class="${infoClass}">
          <div class="home-meta-stack">
            <div class="home-location-line">
              <svg viewBox="0 0 24 24"><path d="M12 21s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10Z"/><circle cx="12" cy="11" r="2.4"/></svg>
              <strong>${geoText}</strong>
            </div>
            <div class="home-status-line">
              <span>${weather.seasonText}</span>
              <span class="dot-sep"></span>
              <span class="info-pair">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.8 1.8"/></svg>
                ${weather.timeText}
              </span>
              <span class="dot-sep"></span>
              <span class="info-pair">
                <svg viewBox="0 0 24 24"><path d="M7 16a4 4 0 1 1 1.3-7.8A5 5 0 0 1 18 10a3.5 3.5 0 0 1-.5 6H7Z"/></svg>
                ${weather.weatherText} ${weather.temperatureText}
              </span>
            </div>
          </div>
        </div>
      `;
      const previewFooter = `
        <div class="window-footer preview-footer">
          <div class="preview-copy-block">
            <div class="window-copy-text">
              <div class="preview-meta">
                <span>${previewLocation}</span>
                <span class="dot-sep"></span>
                <span>${weather.timeText}</span>
                <span class="dot-sep"></span>
                <span>${weather.weatherText} ${weather.temperatureText}</span>
              </div>
            </div>
          </div>
        </div>
      `;
      const playInfo = `
        <div class="play-meta-shell ${showInfo ? "" : "hidden"}">
          <div class="play-meta-location">
            <svg viewBox="0 0 24 24"><path d="M12 21s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10Z"/><circle cx="12" cy="11" r="2.4"/></svg>
            <strong>${geoText}</strong>
          </div>
          <div class="play-meta-line">
            <span>${weather.seasonText}</span>
            <span class="dot-sep"></span>
            <span class="info-pair">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.8 1.8"/></svg>
              ${weather.timeText}
            </span>
            <span class="dot-sep"></span>
            <span class="info-pair">
              <svg viewBox="0 0 24 24"><path d="M7 16a4 4 0 1 1 1.3-7.8A5 5 0 0 1 18 10a3.5 3.5 0 0 1-.5 6H7Z"/></svg>
              ${weather.weatherText} ${weather.temperatureText}
            </span>
          </div>
        </div>
      `;
      const homeFooter = `
        <div class="window-footer home-footer">
          ${homeInfo}
          <div class="window-tags">
            ${tags.map(tag => `<span class="tag">${tag}</span>`).join("")}
          </div>
        </div>
      `;
      return `
        <div class="window-inner">
          <div class="window-media" style="background-image:url('${scene.image.replace(/'/g, "%27")}');filter:${sceneFilter(scene)}"></div>
          ${favoriteBadge}
          <div class="window-copy ${previewClass} ${homeClass} ${playClass}">
            ${isPreview ? previewFooter : isHome ? homeFooter : playInfo}
          </div>
        </div>
      `;
    }

    function renderHome() {
      const scene = currentScene();
      const prev = currentScene(-1);
      const next = currentScene(1);

      el.homeKicker.textContent = "WINDOWSCAPE";
      el.homeTitle.textContent = scene.heroTitle || scene.title;
      el.homeDesc.textContent = scene.heroLine || "";

      const animClass = state.sceneTransitionDirection === "left" ? "anim-left" : "anim-right";
      el.prevButton.innerHTML = `<div class="window-shell preview ${animClass}">${renderWindow(prev, "preview")}</div>`;
      el.nextButton.innerHTML = `<div class="window-shell preview ${animClass}">${renderWindow(next, "preview")}</div>`;
      el.heroWindow.classList.remove("anim-left", "anim-right");
      void el.heroWindow.offsetWidth;
      el.heroWindow.classList.add(animClass);
      el.heroWindow.innerHTML = renderWindow(scene, "home");

      el.sceneDots.innerHTML = sceneSeeds.map((item, index) => `<button class="scene-dot ${index === state.index ? "active" : ""}" data-dot="${index}" aria-label="切换到${item.shortTitle}"></button>`).join("");

      const toolbarButtons = [...el.homeToolbar.querySelectorAll(".icon-btn")];
      toolbarButtons.forEach((button, index) => {
        button.classList.toggle("is-focused", state.homeFocusZone === "toolbar" && state.toolbarIndex === index);
      });
      el.heroWindow.classList.toggle("is-focused", state.homeFocusZone === "hero");
    }

    function renderPlay() {
      const scene = currentScene();
      el.playWindow.innerHTML = renderWindow(scene, "play");
      el.playWindow.classList.toggle("overlay-min", !state.overlayVisible);
      el.playView.classList.toggle("overlay-min", !state.overlayVisible);
      el.playView.classList.toggle("entering", state.playOpening);
      el.playWindow.classList.toggle("is-focused", state.playFocusZone === "stage");
      const railButtons = [...el.playRail.querySelectorAll(".rail-btn")];
      railButtons.forEach((button, index) => {
        button.classList.toggle("is-focused", state.playFocusZone === "rail" && state.railIndex === index);
      });
      updateStatus();
    }

    function renderImmersive() {
      const scene = currentScene();
      el.immersiveShell.innerHTML = renderWindow(scene, "play");
      el.immersiveShell.classList.toggle("overlay-min", !state.overlayVisible);
    }

    function renderSleep() {
      const scene = currentScene();
      const weather = currentWeather(scene);
      el.sleepBg.style.backgroundImage = `url('${scene.image.replace(/'/g, "%27")}')`;
      el.sleepTime.textContent = weather.timeText;
      el.sleepDate.textContent = weather.dateText;
      el.sleepMeta.innerHTML = `
        <span>${scene.location}</span>
        <span class="dot-sep"></span>
        <span>${weather.weatherText} ${weather.temperatureText}</span>
        <span class="dot-sep"></span>
        <span>${weather.seasonText}</span>
      `;
      el.sleepFeed.innerHTML = [
        { title: "消息通知", text: `${scene.shortTitle} 当前窗景已切换至低功耗显示，仍保持在地信息同步。` },
        { title: "影视新闻", text: "今日推荐：在大屏上观看自然风景类内容时，用户更偏好轻量信息与低干扰界面。" },
        { title: "在地资讯", text: `${scene.location} 当前天气为 ${weather.weatherText}，适合继续保留该窗景作为空间氛围背景。` }
      ].map(item => `
        <div class="sleep-card">
          <strong>${item.title}</strong>
          <p>${item.text}</p>
        </div>
      `).join("");
    }

    function renderAll() {
      updateTheme();
      renderHome();
      renderPlay();
      renderImmersive();
      renderSleep();
      if (state.drawer) renderDrawer();
      refreshAutoplay();
    }

    function refreshVisibleTimeOnly() {
      if (state.page === "sleep") {
        renderSleep();
        return;
      }

      if (state.page === "play" || state.page === "immersive") {
        updateStatus();
      }
    }

    function setScene(index, announce = false) {
      state.sceneTransitionDirection = index > state.index || (state.index === sceneSeeds.length - 1 && index === 0) ? "right" : "left";
      state.index = (index + sceneSeeds.length) % sceneSeeds.length;
      renderAll();
      persist();
    }

    function showToast(text) {
      el.toast.textContent = text;
      el.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => el.toast.classList.remove("show"), 1800);
    }

    function openDrawer(type) {
      state.drawer = type;
      state.drawerFocusIndex = 0;
      renderDrawer();
      el.drawer.classList.add("open");
      el.drawerMask.classList.add("open");
      refreshAutoplay();
    }

    function closeDrawer() {
      state.drawer = null;
      el.drawer.classList.remove("open");
      el.drawerMask.classList.remove("open");
      refreshAutoplay();
    }

    function renderDrawer() {
      if (!state.drawer) {
        el.drawer.innerHTML = "";
        return;
      }

      if (state.drawer === "menu") {
        el.drawer.innerHTML = `
          <div class="drawer-head">
            <div class="drawer-head-row">
              <h3>窗景列表</h3>
              <button class="drawer-close" data-close-drawer aria-label="关闭">
                <svg viewBox="0 0 24 24"><path d="M6 6 18 18"/><path d="M18 6 6 18"/></svg>
              </button>
            </div>
            <p>快速切换不同窗景。</p>
          </div>
          <div class="drawer-body">
            ${sceneSeeds.map((scene, index) => `
              <button class="scene-item ${index === state.index ? "is-current" : ""}" data-scene-index="${index}" data-drawer-index="${index}">
                <div class="scene-thumb" style="--thumb-base:${scene.frame.base};--thumb-edge:${scene.frame.edge};">
                  <div class="scene-thumb-inner" style="background-image:url('${scene.image.replace(/'/g, "%27")}')"></div>
                </div>
                <div class="scene-info">
                  <strong>${scene.title}</strong>
                  <p>${scene.detail}</p>
                  <div class="scene-pills">
                    <span class="mini-tag">${scene.shortTitle}</span>
                    <span class="mini-tag">${currentWeather(scene).weatherText} ${currentWeather(scene).temperatureText}</span>
                    <span class="mini-tag">${currentWeather(scene).seasonText}</span>
                  </div>
                </div>
                <span class="mini-tag">${state.favorites.has(scene.id) ? "已收藏" : "进入"}</span>
              </button>
            `).join("")}
          </div>
        `;
        return;
      }

      if (state.drawer === "season") {
        const scene = currentScene();
        const weather = currentWeather(scene);
        el.drawer.innerHTML = `
          <div class="drawer-head">
            <div class="drawer-head-row">
              <h3>时季调节</h3>
              <button class="drawer-close" data-close-drawer aria-label="关闭">
                <svg viewBox="0 0 24 24"><path d="M6 6 18 18"/><path d="M18 6 6 18"/></svg>
              </button>
            </div>
            <p>当前窗景默认与在地时间、天气、季节实时同步，适合用于全屏沉浸展示。</p>
          </div>
          <div class="drawer-body">
            <div class="setting-card">
              <h4>当前同步状态</h4>
              <p>${scene.location} · ${weather.seasonText} · ${weather.timeText} · ${weather.weatherText} ${weather.temperatureText}</p>
            </div>
            <button class="season-option is-current" data-drawer-index="0" data-season-action="realtime">
              <strong>实时同步</strong>
              <span>跟随当地此刻时间、天气与季节变化，当前推荐保持开启。</span>
            </button>
            <button class="season-option" data-drawer-index="1" data-season-action="sunset">
              <strong>黄昏演绎</strong>
              <span>适合在空间展示中快速切换到更有氛围的暮色效果。</span>
            </button>
            <button class="season-option" data-drawer-index="2" data-season-action="winter">
              <strong>冬季演绎</strong>
              <span>适合快速预览冬季氛围，当前 Demo 中作为概念预览入口。</span>
            </button>
          </div>
        `;
        requestAnimationFrame(() => setDrawerFocus(state.drawerFocusIndex));
        return;
      }

      const sleepOff = !state.settings.allowSleep;
      const blackDisabled = sleepOff || !state.settings.allowBlack;
      el.drawer.innerHTML = `
        <div class="drawer-head">
          <div class="drawer-head-row">
            <h3>窗景设置</h3>
            <button class="drawer-close" data-close-drawer aria-label="关闭">
              <svg viewBox="0 0 24 24"><path d="M6 6 18 18"/><path d="M18 6 6 18"/></svg>
            </button>
          </div>
          <p>面向电视端的轻量设置。</p>
        </div>
        <div class="drawer-body">
          <div class="setting-card">
            <h4>浏览与信息</h4>
            <p>以图为主，信息尽量轻。</p>
            <div class="setting-row" data-drawer-index="0" data-control-type="toggle" data-control-key="showInfo">
              <div class="setting-label">
                <strong>显示嵌入式信息</strong>
                <span>展示地点、时间、天气与季节。</span>
              </div>
              <label class="switch">
                <input type="checkbox" data-setting="showInfo" ${state.settings.showInfo ? "checked" : ""}/>
                <span class="switch-track"></span>
                <span class="switch-thumb"></span>
              </label>
            </div>
            <div class="setting-row" data-drawer-index="1" data-control-type="toggle" data-control-key="autoplayHome">
              <div class="setting-label">
                <strong>首页自动轮播</strong>
                <span>首页自动切换不同窗景。</span>
              </div>
              <label class="switch">
                <input type="checkbox" data-setting="autoplayHome" ${state.settings.autoplayHome ? "checked" : ""}/>
                <span class="switch-track"></span>
                <span class="switch-thumb"></span>
              </label>
            </div>
            <div class="range-group ${!state.settings.autoplayHome ? "disabled" : ""}" data-drawer-index="2" data-control-type="range" data-control-key="autoplayInterval" data-min="8" data-max="30" data-step="1">
              <div class="range-head">
                <span>首页轮播间隔</span>
                <strong>${state.settings.autoplayInterval} 秒</strong>
              </div>
              <input type="range" min="8" max="30" step="1" value="${state.settings.autoplayInterval}" data-range="autoplayInterval"/>
              <div class="range-note">建议 12–18 秒。</div>
            </div>
          </div>

          <div class="setting-card">
            <h4>息屏与黑屏</h4>
            <p>窗景 → 息屏 → 黑屏。</p>
            <div class="setting-row" data-drawer-index="3" data-control-type="toggle" data-control-key="allowSleep">
              <div class="setting-label">
                <strong>允许进入息屏显示</strong>
                <span>开启后，将在屏保播放 ${state.settings.sleepTimeout} 秒后进入低功耗水墨屏模式。</span>
              </div>
              <label class="switch">
                <input type="checkbox" data-setting="allowSleep" ${state.settings.allowSleep ? "checked" : ""}/>
                <span class="switch-track"></span>
                <span class="switch-thumb"></span>
              </label>
            </div>
            <div class="range-group ${sleepOff ? "disabled" : ""}" data-drawer-index="4" data-control-type="range" data-control-key="sleepTimeout" data-min="20" data-max="180" data-step="5">
              <div class="range-head">
                <span>窗景 → 息屏 超时</span>
                <strong>${state.settings.sleepTimeout} 秒</strong>
              </div>
              <input type="range" min="20" max="180" step="5" value="${state.settings.sleepTimeout}" data-range="sleepTimeout" ${sleepOff ? "disabled" : ""}/>
              <div class="range-note">息屏前会弹出 3 秒提示：即将为您自动切换至水墨屏低功耗模式。</div>
            </div>
            <div class="setting-row ${sleepOff ? "disabled" : ""}" data-drawer-index="5" data-control-type="toggle" data-control-key="allowBlack">
              <div class="setting-label">
                <strong>允许进入黑屏</strong>
                <span>${sleepOff ? "需先开启息屏显示，黑屏开关才可选择。" : `开启后，息屏持续 ${state.settings.blackTimeout} 秒后自动黑屏。`}</span>
              </div>
              <label class="switch ${sleepOff ? "disabled" : ""}">
                <input type="checkbox" data-setting="allowBlack" ${state.settings.allowBlack ? "checked" : ""} ${sleepOff ? "disabled" : ""}/>
                <span class="switch-track"></span>
                <span class="switch-thumb"></span>
              </label>
            </div>
            <div class="range-group ${blackDisabled ? "disabled" : ""}" data-drawer-index="6" data-control-type="range" data-control-key="blackTimeout" data-min="30" data-max="300" data-step="10">
              <div class="range-head">
                <span>息屏 → 黑屏 超时</span>
                <strong>${state.settings.blackTimeout} 秒</strong>
              </div>
              <input type="range" min="30" max="300" step="10" value="${state.settings.blackTimeout}" data-range="blackTimeout" ${blackDisabled ? "disabled" : ""}/>
              <div class="range-note">黑屏前会弹出 3 秒提示：即将为您自动黑屏，可任意按键唤起或打断。</div>
            </div>
          </div>

          <div class="setting-card">
            <h4>动效与焦点</h4>
            <p>遥控器是这套 Demo 的主交互方式，减少动效会让焦点移动更克制。</p>
            <div class="setting-row" data-drawer-index="7" data-control-type="toggle" data-control-key="reduceMotion">
              <div class="setting-label">
                <strong>减少动效</strong>
                <span>降低漂移与过渡强度，更适合更稳、更轻的电视端体验展示。</span>
              </div>
              <label class="switch">
                <input type="checkbox" data-setting="reduceMotion" ${state.settings.reduceMotion ? "checked" : ""}/>
                <span class="switch-track"></span>
                <span class="switch-thumb"></span>
              </label>
            </div>
          </div>
        </div>
      `;

      requestAnimationFrame(() => {
        const focusables = [...el.drawer.querySelectorAll("[data-drawer-index]")];
        focusables.forEach((node) => {
          node.classList.toggle("is-focused", Number(node.dataset.drawerIndex) === state.drawerFocusIndex);
        });
      });
    }

    function showPrompt(type, seconds) {
      clearInterval(promptTimer);
      state.promptType = type;
      state.promptCountdown = seconds;
      const isBlack = type === "black";
      el.prompt.className = `prompt show ${isBlack ? "dark" : ""}`;
      el.prompt.innerHTML = `
        <div class="prompt-copy">
          <div class="prompt-title">${isBlack ? "即将为您自动黑屏，可任意按键唤起或打断" : "即将为您自动切换至水墨屏低功耗模式"}</div>
          <div class="prompt-sub">倒计时结束后自动切换</div>
        </div>
        <div class="prompt-count">${seconds}</div>
      `;
      promptTimer = setInterval(() => {
        state.promptCountdown -= 1;
        if (state.promptCountdown <= 0) {
          hidePrompt();
          if (type === "sleep") enterSleep();
          if (type === "black") enterBlack();
          return;
        }
        const count = el.prompt.querySelector(".prompt-count");
        if (count) count.textContent = state.promptCountdown;
      }, 1000);
    }

    function hidePrompt() {
      clearInterval(promptTimer);
      state.promptType = null;
      el.prompt.classList.remove("show", "dark");
    }

    function wakeOverlay() {
      if (state.page !== "play" && state.page !== "immersive") return;
      state.overlayVisible = true;
      renderPlay();
      renderImmersive();
      clearTimeout(state.overlayTimer);
      state.overlayTimer = setTimeout(() => {
        state.overlayVisible = false;
        renderPlay();
        renderImmersive();
      }, 3000);
    }

    function touchInteraction() {
      state.lastInteractionAt = Date.now();
      if (state.page === "play" || state.page === "immersive") {
        wakeOverlay();
      }
      if (state.page !== "sleep" && state.page !== "black") {
        hidePrompt();
      }
      updateStatus();
    }

    function updateStatus() {
      if (state.page === "play" || state.page === "immersive") {
        if (!state.settings.allowSleep) {
          el.statusTitle.textContent = "息屏显示已关闭";
          el.statusSub.textContent = "当前会持续停留在窗景播放层，不再自动进入低功耗状态。";
          return;
        }
        const elapsed = Math.floor((Date.now() - state.lastInteractionAt) / 1000);
        const remain = Math.max(0, state.settings.sleepTimeout - elapsed);
        el.statusTitle.textContent = `距离进入息屏还有 ${remain} 秒`;
        el.statusSub.textContent = state.settings.allowBlack
          ? `息屏后还将继续倒计时 ${state.settings.blackTimeout} 秒进入黑屏。`
          : "黑屏开关已关闭，到达息屏层后会继续停留。";
        return;
      }
      if (state.page === "sleep") {
        if (!state.settings.allowBlack) {
          el.statusTitle.textContent = "当前处于息屏显示";
          el.statusSub.textContent = "黑屏阀门关闭，息屏层将持续保持。";
          return;
        }
        const elapsed = Math.floor((Date.now() - state.sleepStartedAt) / 1000);
        const remain = Math.max(0, state.settings.blackTimeout - elapsed);
        el.statusTitle.textContent = `距离进入黑屏还有 ${remain} 秒`;
        el.statusSub.textContent = "任意按键可直接返回首页。";
        return;
      }
      el.statusTitle.textContent = "浏览窗景首页";
      el.statusSub.textContent = "通过遥控器左右切换，OK 进入当前窗景。";
    }

    function setPage(page) {
      state.page = page;
      if (state.drawer && (page === "sleep" || page === "black" || page === "immersive")) closeDrawer();
      el.homeView.classList.toggle("active", page === "home");
      el.playView.classList.toggle("active", page === "play");
      el.immersiveView.classList.toggle("active", page === "immersive");
      el.sleepView.classList.toggle("active", page === "sleep");
      el.blackView.classList.toggle("active", page === "black");
      if (page === "play" || page === "immersive") wakeOverlay();
      updateStatus();
      refreshAutoplay();
    }

    function enterPlay() {
      clearTimeout(state.playOpeningTimer);
      state.playFocusZone = "stage";
      state.railIndex = 0;
      state.overlayVisible = true;
      state.playOpening = true;
      setPage("play");
      state.playOpeningTimer = setTimeout(() => {
        state.playOpening = false;
        renderPlay();
      }, 760);
      touchInteraction();
    }

    function exitToHome() {
      clearTimeout(state.playOpeningTimer);
      state.playOpening = false;
      setPage("home");
      touchInteraction();
    }

    function enterImmersive() {
      setPage("immersive");
      touchInteraction();
    }

    function exitImmersive() {
      setPage("play");
      touchInteraction();
    }

    function enterSleep() {
      state.sleepStartedAt = Date.now();
      setPage("sleep");
      renderSleep();
    }

    function enterBlack() {
      setPage("black");
    }

    function wakeFromSleep() {
      setPage("home");
      showToast("已从息屏返回首页");
      touchInteraction();
    }

    function wakeFromBlack() {
      setPage("home");
      showToast("已从黑屏返回 Launcher");
      touchInteraction();
    }

    function toggleFavorite() {
      const scene = currentScene();
      if (state.favorites.has(scene.id)) {
        state.favorites.delete(scene.id);
        showToast(`已取消收藏 ${scene.shortTitle}`);
      } else {
        state.favorites.add(scene.id);
        showToast(`已收藏 ${scene.shortTitle}`);
      }
      persist();
      renderDrawer();
    }

    function setCurrentSceneAsScreensaver() {
      const scene = currentScene();
      state.screensaverSceneId = scene.id;
      persist();
      showToast(`已将 ${scene.shortTitle} 设为屏保`);
    }

    function refreshAutoplay() {
      clearInterval(homeAutoplayTimer);
      if (state.page !== "home" || state.drawer || !state.settings.autoplayHome) return;
      homeAutoplayTimer = setInterval(() => {
        if (state.page !== "home" || state.drawer) return;
        setScene(state.index + 1);
      }, state.settings.autoplayInterval * 1000);
    }

    function setToolbarIndex(index) {
      const buttons = [...el.homeToolbar.querySelectorAll(".icon-btn")];
      state.toolbarIndex = clamp(index, 0, buttons.length - 1);
      renderHome();
    }

    function setRailIndex(index) {
      const buttons = [...el.playRail.querySelectorAll(".rail-btn")];
      state.railIndex = clamp(index, 0, buttons.length - 1);
      renderPlay();
    }

    function triggerHomeAction(action) {
      if (action === "menu") openDrawer("menu");
      if (action === "favorite") {
        toggleFavorite();
        state.homeFocusZone = "hero";
        renderHome();
      }
      if (action === "settings") openDrawer("settings");
    }

    function triggerRailAction(action) {
      if (action === "immersive") enterImmersive();
      if (action === "season") openDrawer("season");
      if (action === "screensaver") setCurrentSceneAsScreensaver();
    }

    function drawerItems() {
      return [...el.drawer.querySelectorAll("[data-drawer-index]")];
    }

    function setDrawerFocus(index) {
      const items = drawerItems();
      if (!items.length) return;
      state.drawerFocusIndex = clamp(index, 0, items.length - 1);
      items.forEach((node) => {
        node.classList.toggle("is-focused", Number(node.dataset.drawerIndex) === state.drawerFocusIndex);
      });
    }

    function toggleSettingKey(key) {
      state.settings[key] = !state.settings[key];
      normalizeSettings();
      persist();
      renderAll();
      renderDrawer();
      showToast(`${settingLabel(key)}已${state.settings[key] ? "开启" : "关闭"}`);
    }

    function adjustRangeKey(key, step, min, max, direction) {
      state.settings[key] = clamp(state.settings[key] + step * direction, min, max);
      normalizeSettings();
      persist();
      renderDrawer();
      updateStatus();
      refreshAutoplay();
    }

    function handleDrawerKey(event) {
      const items = drawerItems();
      if (!items.length) return false;

      if (event.key === "ArrowUp") {
        setDrawerFocus(state.drawerFocusIndex - 1);
        return true;
      }
      if (event.key === "ArrowDown") {
        setDrawerFocus(state.drawerFocusIndex + 1);
        return true;
      }

      const current = items[state.drawerFocusIndex];
      if (!current) return false;
      if (current.classList.contains("disabled")) return false;

      if (state.drawer === "menu") {
        if (event.key === "Enter" || event.key === " ") {
          setScene(Number(current.dataset.sceneIndex), true);
          closeDrawer();
          return true;
        }
        return false;
      }

      const type = current.dataset.controlType;
      const key = current.dataset.controlKey;
      if (!type || !key) return false;

      if (type === "toggle" && (event.key === "Enter" || event.key === " " || event.key === "ArrowLeft" || event.key === "ArrowRight")) {
        toggleSettingKey(key);
        return true;
      }

      if (type === "range" && (event.key === "ArrowLeft" || event.key === "ArrowRight")) {
        adjustRangeKey(
          key,
          Number(current.dataset.step),
          Number(current.dataset.min),
          Number(current.dataset.max),
          event.key === "ArrowRight" ? 1 : -1
        );
        return true;
      }

      return false;
    }

    function handleHomeKey(event) {
      if (state.homeFocusZone === "hero") {
        if (event.key === "ArrowLeft") {
          setScene(state.index - 1, true);
          return true;
        }
        if (event.key === "ArrowRight") {
          setScene(state.index + 1, true);
          return true;
        }
        if (event.key === "ArrowUp") {
          state.homeFocusZone = "toolbar";
          renderHome();
          return true;
        }
        if (event.key === "Enter" || event.key === " ") {
          enterPlay();
          return true;
        }
      } else {
        if (event.key === "ArrowLeft") {
          setToolbarIndex(state.toolbarIndex - 1);
          return true;
        }
        if (event.key === "ArrowRight") {
          setToolbarIndex(state.toolbarIndex + 1);
          return true;
        }
        if (event.key === "ArrowDown") {
          state.homeFocusZone = "hero";
          renderHome();
          return true;
        }
        if (event.key === "Enter" || event.key === " ") {
          const action = el.homeToolbar.querySelectorAll(".icon-btn")[state.toolbarIndex]?.dataset.homeAction;
          if (action) triggerHomeAction(action);
          return true;
        }
      }
      return false;
    }

    function handlePlayKey(event) {
      if (state.playFocusZone === "rail") {
        if (event.key === "ArrowUp") {
          setRailIndex(state.railIndex - 1);
          return true;
        }
        if (event.key === "ArrowDown") {
          setRailIndex(state.railIndex + 1);
          return true;
        }
        if (event.key === "ArrowLeft") {
          state.playFocusZone = "stage";
          renderPlay();
          return true;
        }
        if (event.key === "Enter" || event.key === " ") {
          const action = el.playRail.querySelectorAll(".rail-btn")[state.railIndex]?.dataset.railAction;
          if (action) triggerRailAction(action);
          return true;
        }
      } else {
        if (event.key === "ArrowLeft") {
          setScene(state.index - 1, true);
          return true;
        }
        if (event.key === "ArrowRight") {
          setScene(state.index + 1, true);
          return true;
        }
        if (event.key === "ArrowUp" || event.key === "ArrowDown") {
          state.playFocusZone = "rail";
          renderPlay();
          return true;
        }
      }
      if (event.key === "ArrowLeft") {
        setScene(state.index - 1, true);
        return true;
      }
      if (event.key === "ArrowRight") {
        setScene(state.index + 1, true);
        return true;
      }
      return false;
    }

    function attachEvents() {
      el.prevButton.addEventListener("click", () => { setScene(state.index - 1, true); touchInteraction(); });
      el.nextButton.addEventListener("click", () => { setScene(state.index + 1, true); touchInteraction(); });
      el.leftStageArrow.addEventListener("click", () => { setScene(state.index - 1, true); touchInteraction(); });
      el.rightStageArrow.addEventListener("click", () => { setScene(state.index + 1, true); touchInteraction(); });
      el.heroWindow.addEventListener("click", enterPlay);
      el.backButton.addEventListener("click", exitToHome);
      el.playSettings.addEventListener("click", () => openDrawer("settings"));
      el.drawerMask.addEventListener("click", closeDrawer);
      el.sleepView.addEventListener("click", wakeFromSleep);
      el.blackView.addEventListener("click", wakeFromBlack);
      el.immersiveExit.addEventListener("click", exitImmersive);
      el.immersivePrev.addEventListener("click", () => { setScene(state.index - 1, true); touchInteraction(); });
      el.immersiveNext.addEventListener("click", () => { setScene(state.index + 1, true); touchInteraction(); });

      el.homeToolbar.addEventListener("click", (event) => {
        const button = event.target.closest("[data-home-action]");
        if (!button) return;
        state.homeFocusZone = "toolbar";
        state.toolbarIndex = [...el.homeToolbar.querySelectorAll(".icon-btn")].indexOf(button);
        triggerHomeAction(button.dataset.homeAction);
        renderHome();
        touchInteraction();
      });

      el.playRail.addEventListener("click", (event) => {
        const button = event.target.closest("[data-rail-action]");
        if (!button) return;
        state.playFocusZone = "rail";
        state.railIndex = [...el.playRail.querySelectorAll(".rail-btn")].indexOf(button);
        triggerRailAction(button.dataset.railAction);
        renderPlay();
        touchInteraction();
      });

      document.addEventListener("click", (event) => {
        const dot = event.target.closest("[data-dot]");
        if (dot) {
          setScene(Number(dot.dataset.dot), true);
          touchInteraction();
        }
      });

      el.drawer.addEventListener("click", (event) => {
        const close = event.target.closest("[data-close-drawer]");
        if (close) {
          closeDrawer();
          return;
        }
        const sceneItem = event.target.closest("[data-scene-index]");
        if (sceneItem) {
          setScene(Number(sceneItem.dataset.sceneIndex), true);
          closeDrawer();
          return;
        }
        const seasonAction = event.target.closest("[data-season-action]");
        if (seasonAction) {
          const labels = {
            realtime: "当前已切换为实时同步",
            sunset: "黄昏演绎将在下一版接入实时预览",
            winter: "冬季演绎将在下一版接入实时预览"
          };
          showToast(labels[seasonAction.dataset.seasonAction] || "时季调节已更新");
        }
      });

      el.drawer.addEventListener("input", (event) => {
        const target = event.target;
        if (target.dataset.setting) {
          state.settings[target.dataset.setting] = target.checked;
          normalizeSettings();
          persist();
          renderAll();
          showToast(`${settingLabel(target.dataset.setting)}已${state.settings[target.dataset.setting] ? "开启" : "关闭"}`);
          return;
        }
        if (target.dataset.range) {
          state.settings[target.dataset.range] = Number(target.value);
          normalizeSettings();
          persist();
          renderDrawer();
          updateStatus();
          refreshAutoplay();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (state.page === "black") {
          event.preventDefault();
          wakeFromBlack();
          return;
        }

        if (state.page === "sleep") {
          event.preventDefault();
          wakeFromSleep();
          return;
        }

        if (state.drawer) {
          const handled = handleDrawerKey(event);
          if (handled) {
            event.preventDefault();
          }
          if (event.key === "Escape" || event.key === "Backspace") {
            event.preventDefault();
            closeDrawer();
          }
          touchInteraction();
          return;
        }

        if (event.key.toLowerCase() === "s") {
          event.preventDefault();
          openDrawer("settings");
          touchInteraction();
          return;
        }

        if (event.key.toLowerCase() === "m") {
          event.preventDefault();
          openDrawer("menu");
          touchInteraction();
          return;
        }

        if (event.key === "Escape" || event.key === "Backspace") {
          event.preventDefault();
          if (state.page === "immersive") {
            exitImmersive();
          } else if (state.page === "play") {
            exitToHome();
          }
          return;
        }

        let handled = false;
        if (state.page === "home") handled = handleHomeKey(event);
        if (state.page === "play") handled = handlePlayKey(event);
        if (state.page === "immersive") {
          if (event.key === "ArrowLeft") { setScene(state.index - 1, true); handled = true; }
          if (event.key === "ArrowRight") { setScene(state.index + 1, true); handled = true; }
          if (event.key === "Enter" || event.key === " ") { exitImmersive(); handled = true; }
        }

        if (handled) {
          event.preventDefault();
          touchInteraction();
        }
      });

      ["click", "touchstart"].forEach((name) => {
        document.addEventListener(name, () => {
          if (state.page !== "sleep" && state.page !== "black") touchInteraction();
        }, { passive: true });
      });
    }

    function settingLabel(key) {
      const map = {
        showInfo: "嵌入式信息",
        autoplayHome: "首页自动轮播",
        allowSleep: "息屏显示",
        allowBlack: "黑屏模式",
        reduceMotion: "减少动效"
      };
      return map[key] || key;
    }

    function tick() {
      refreshVisibleTimeOnly();

      if (state.page === "play" || state.page === "immersive") {
        if (!state.settings.allowSleep || state.drawer) return;
        const elapsed = Math.floor((Date.now() - state.lastInteractionAt) / 1000);
        const remain = state.settings.sleepTimeout - elapsed;
        if (remain <= 3 && remain > 0 && state.promptType !== "sleep") showPrompt("sleep", remain);
        if (remain <= 0 && state.promptType !== "sleep") enterSleep();
        return;
      }

      if (state.page === "sleep") {
        if (!state.settings.allowBlack) return;
        const elapsed = Math.floor((Date.now() - state.sleepStartedAt) / 1000);
        const remain = state.settings.blackTimeout - elapsed;
        if (remain <= 3 && remain > 0 && state.promptType !== "black") showPrompt("black", remain);
        if (remain <= 0 && state.promptType !== "black") enterBlack();
      }
    }

    function boot() {
      loadPersisted();
      renderAll();
      attachEvents();
      refreshWeather();
      setInterval(refreshWeather, 10 * 60 * 1000);
      setInterval(tick, 1000);
    }

    boot();
  </script>
</body>
</html>
