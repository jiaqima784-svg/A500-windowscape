<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A500 窗景 · 真实电视屏幕模拟 Demo</title>
<style>
/* ============================================
   CSS RESET & BASE
   ============================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --white: #FFFFFF;
  --gray-100: #F5F5F5;
  --gray-300: #D4D4D4;
  --gray-500: #737373;
  --gray-700: #404040;
  --gray-900: #171717;
  --ink: #1A1A2E;
  --accent-blue: #3B82F6;
  --accent-green: #4ADE80;
  --accent-amber: #F59E0B;
  --accent-red: #EF4444;
  --font-cn: 'Source Han Serif SC', 'STSong', 'SimSun', 'Noto Serif SC', serif;
  --font-sans: 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

html { font-size: 16px; }

body {
  font-family: var(--font-sans);
  background: #0a0a0f;
  color: var(--white);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

/* ============================================
   TV FRAME
   ============================================ */
#tvFrame {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #050508;
}

#tvScreen {
  position: relative;
  width: 95vw;
  height: 95vh;
  max-width: 1600px;
  max-height: 900px;
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(0,0,0,0.8), inset 0 0 1px rgba(255,255,255,0.1);
  background: #000;
}

/* ============================================
   SCREEN STATES
   ============================================ */
.screen {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s ease;
}

.screen.active {
  opacity: 1;
  pointer-events: auto;
}

/* --- HOME SCREEN --- */
#screen-home {
  background: linear-gradient(180deg, #0D1117 0%, #1a1a2e 40%, #16213e 70%, #0D1117 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.home-content {
  text-align: center;
  z-index: 2;
}

.home-logo {
  font-family: var(--font-cn);
  font-size: 64px;
  font-weight: 200;
  letter-spacing: 16px;
  color: rgba(255,255,255,0.85);
  margin-bottom: 12px;
}

.home-subtitle {
  font-size: 14px;
  color: rgba(255,255,255,0.3);
  letter-spacing: 4px;
  margin-bottom: 48px;
}

.home-bg-art {
  position: absolute;
  inset: 0;
  opacity: 0.08;
  background:
    radial-gradient(ellipse at 30% 60%, rgba(59,130,246,0.3) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 40%, rgba(74,222,128,0.2) 0%, transparent 50%);
}

.home-hint {
  position: absolute;
  bottom: 40px;
  font-size: 12px;
  color: rgba(255,255,255,0.2);
  letter-spacing: 2px;
  animation: homePulse 3s ease-in-out infinite;
}

@keyframes homePulse {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 0.5; }
}

/* --- DAILY POEM SCREEN --- */
#screen-poem {
  background: linear-gradient(180deg, #0D1117 0%, #1a1a2e 40%, #16213e 70%, #0D1117 100%);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 80px;
}

.poem-bg-art {
  position: absolute;
  inset: 0;
  opacity: 0.15;
  filter: blur(20px);
  background:
    radial-gradient(ellipse at 50% 30%, rgba(59,130,246,0.2) 0%, transparent 60%),
    radial-gradient(ellipse at 20% 70%, rgba(74,222,128,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(245,158,11,0.1) 0%, transparent 40%);
}

.poem-container {
  text-align: center;
  z-index: 2;
  max-width: 700px;
  padding: 0 40px;
}

.poem-text {
  font-family: var(--font-cn);
  font-size: 28px;
  font-weight: 200;
  line-height: 1.8;
  color: rgba(255,255,255,0.8);
  letter-spacing: 3px;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 1s ease, transform 1s ease;
}

.poem-text.visible {
  opacity: 1;
  transform: translateY(0);
}

.poem-text.fading {
  opacity: 0;
  transform: translateY(-10px);
}

.poem-source {
  font-size: 14px;
  color: rgba(255,255,255,0.35);
  margin-top: 16px;
  letter-spacing: 2px;
  opacity: 0;
  transition: opacity 1s ease 0.3s;
}

.poem-source.visible { opacity: 1; }

.poem-context {
  font-size: 11px;
  color: rgba(255,255,255,0.2);
  margin-top: 8px;
  letter-spacing: 1px;
  opacity: 0;
  transition: opacity 1s ease 0.5s;
}

.poem-context.visible { opacity: 1; }

/* --- SCREENSAVER SCREEN --- */
#screen-screensaver {
  display: flex;
  flex-direction: column;
}

.scene-canvas {
  flex: 1;
  position: relative;
  overflow: hidden;
}

/* Scene base - West Lake */
.scene-base {
  position: absolute;
  inset: 0;
  transition: background 2s ease;
}

/* Time-based scene variations */
.scene-base.morning {
  background: linear-gradient(180deg,
    #2D4A6E 0%,
    #4A7098 15%,
    #6B8FB5 25%,
    #8BB5D4 40%,
    #A8CCE0 50%,
    #7BA8C8 60%,
    #5A8BB5 70%,
    #3D6E95 80%,
    #2D5580 90%,
    #1D3D60 100%
  );
}

.scene-base.daytime {
  background: linear-gradient(180deg,
    #3A6B9F 0%,
    #5A90C5 20%,
    #7AABD8 35%,
    #95BFE5 50%,
    #7BA8C8 65%,
    #5A8BB5 80%,
    #3D6E95 100%
  );
}

.scene-base.evening {
  background: linear-gradient(180deg,
    #1A2040 0%,
    #2D3060 15%,
    #4A3060 25%,
    #8B4060 40%,
    #C56050 50%,
    #A05045 60%,
    #6A3D55 70%,
    #3D2D45 80%,
    #2A1D35 90%,
    #1A1025 100%
  );
}

.scene-base.night {
  background: linear-gradient(180deg,
    #0A0E1A 0%,
    #0F1525 20%,
    #141D30 40%,
    #1A2540 55%,
    #141D30 70%,
    #0F1525 85%,
    #0A0E1A 100%
  );
}

/* Weather overlays */
.weather-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 2s ease;
}

.weather-overlay.active { opacity: 1; }

.weather-overlay.rain {
  background: repeating-linear-gradient(
    170deg,
    transparent,
    transparent 3px,
    rgba(150,180,220,0.08) 3px,
    rgba(150,180,220,0.08) 4px
  );
  animation: rainFall 0.5s linear infinite;
}

.weather-overlay.snow {
  background:
    radial-gradient(circle 2px at 10% 20%, rgba(255,255,255,0.4), transparent),
    radial-gradient(circle 1.5px at 30% 50%, rgba(255,255,255,0.3), transparent),
    radial-gradient(circle 2.5px at 50% 15%, rgba(255,255,255,0.35), transparent),
    radial-gradient(circle 1px at 70% 60%, rgba(255,255,255,0.25), transparent),
    radial-gradient(circle 2px at 90% 30%, rgba(255,255,255,0.4), transparent),
    radial-gradient(circle 1.5px at 20% 80%, rgba(255,255,255,0.3), transparent),
    radial-gradient(circle 2px at 60% 90%, rgba(255,255,255,0.35), transparent),
    radial-gradient(circle 1px at 80% 70%, rgba(255,255,255,0.2), transparent);
  animation: snowFall 3s linear infinite;
}

.weather-overlay.cloudy {
  background: rgba(0,0,0,0.15);
}

@keyframes rainFall {
  0% { transform: translateY(-10px); }
  100% { transform: translateY(10px); }
}

@keyframes snowFall {
  0% { transform: translateY(-20px) translateX(0); }
  50% { transform: translateY(10px) translateX(10px); }
  100% { transform: translateY(40px) translateX(0); }
}

/* Season overlay */
.season-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  transition: background 2s ease;
}

/* Lake surface */
.lake-surface {
  position: absolute;
  bottom: 25%;
  left: 0; right: 0;
  height: 40%;
  background: linear-gradient(180deg,
    rgba(100,150,200,0.15) 0%,
    rgba(80,130,180,0.1) 50%,
    rgba(60,110,160,0.05) 100%
  );
}

.lake-ripple {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 8px,
    rgba(255,255,255,0.02) 8px,
    rgba(255,255,255,0.02) 9px
  );
  animation: lakeRipple 4s ease-in-out infinite;
}

@keyframes lakeRipple {
  0%, 100% { transform: translateY(0); opacity: 0.5; }
  50% { transform: translateY(3px); opacity: 1; }
}

/* Mountains */
.mountain-far {
  position: absolute;
  bottom: 55%;
  left: -5%; right: -5%;
  height: 20%;
}

.mountain-far::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  height: 100%;
  background:
    linear-gradient(155deg, transparent 45%, rgba(60,80,100,0.3) 45%, rgba(60,80,100,0.3) 46%, transparent 46%),
    linear-gradient(205deg, transparent 50%, rgba(50,70,90,0.25) 50%, rgba(50,70,90,0.25) 51%, transparent 51%);
}

.mountain-near {
  position: absolute;
  bottom: 35%;
  left: -5%; right: -5%;
  height: 25%;
}

.mountain-near::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  height: 100%;
  background:
    linear-gradient(160deg, transparent 40%, rgba(40,60,80,0.4) 40%, rgba(40,60,80,0.4) 41%, transparent 41%),
    linear-gradient(200deg, transparent 55%, rgba(35,55,75,0.35) 55%, rgba(35,55,75,0.35) 56%, transparent 56%);
}

/* Window sill */
.window-sill {
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  height: 25%;
  background: linear-gradient(180deg,
    rgba(30,25,20,0.8) 0%,
    rgba(25,20,15,0.9) 30%,
    rgba(20,15,10,0.95) 100%
  );
  border-top: 3px solid rgba(60,50,40,0.6);
}

.window-sill::before {
  content: '';
  position: absolute;
  top: 3px;
  left: 0; right: 0;
  height: 1px;
  background: rgba(80,70,55,0.3);
}

/* Window frame */
.window-frame-left,
.window-frame-right {
  position: absolute;
  top: 0; bottom: 0;
  width: 24px;
  background: linear-gradient(180deg,
    rgba(35,30,25,0.9),
    rgba(25,20,15,0.95)
  );
  z-index: 3;
}
.window-frame-left { left: 0; }
.window-frame-right { right: 0; }

.window-frame-top {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 24px;
  background: linear-gradient(90deg,
    rgba(35,30,25,0.9),
    rgba(30,25,20,0.9),
    rgba(35,30,25,0.9)
  );
  z-index: 3;
}

.window-frame-bottom {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 12px;
  background: linear-gradient(90deg,
    rgba(25,20,15,0.95),
    rgba(20,15,10,1),
    rgba(25,20,15,0.95)
  );
  z-index: 3;
}

/* Window sill objects */
.sill-object {
  position: absolute;
  z-index: 4;
}

/* Teacup */
.teacup {
  bottom: 8%;
  left: 15%;
  width: 30px;
  height: 20px;
}

.teacup::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 24px;
  height: 16px;
  background: radial-gradient(ellipse, rgba(180,150,120,0.6), rgba(140,110,80,0.4));
  border-radius: 0 0 4px 4px;
}

.teacup::after {
  content: '';
  position: absolute;
  bottom: 14px;
  left: 2px;
  width: 20px;
  height: 4px;
  background: rgba(180,150,120,0.4);
  border-radius: 2px;
}

/* Book */
.book {
  bottom: 8%;
  right: 20%;
  width: 40px;
  height: 25px;
}

.book::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 36px;
  height: 6px;
  background: rgba(120,90,60,0.5);
  border-radius: 1px;
}

.book::after {
  content: '';
  position: absolute;
  bottom: 6px;
  left: 2px;
  width: 32px;
  height: 18px;
  background: rgba(180,160,130,0.3);
  border-radius: 1px 3px 1px 1px;
  transform: rotate(-5deg);
}

/* Plant */
.plant {
  bottom: 8%;
  right: 8%;
  width: 20px;
  height: 40px;
}

.plant::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 16px;
  height: 12px;
  background: rgba(100,70,40,0.5);
  border-radius: 2px 2px 4px 4px;
}

.plant::after {
  content: '';
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 2px;
  height: 20px;
  background: rgba(80,120,60,0.4);
}

/* Characters (narrative elements) */
.character {
  position: absolute;
  z-index: 5;
  opacity: 0;
  transition: opacity 2s ease;
}

.character.visible { opacity: 1; }

/* Bird */
.bird {
  top: 20%;
  right: 30%;
  width: 20px;
  height: 10px;
}

.bird::before {
  content: '';
  position: absolute;
  width: 12px;
  height: 3px;
  background: rgba(80,80,80,0.5);
  border-radius: 50%;
  animation: birdFly 2s ease-in-out infinite;
}

.bird::after {
  content: '';
  position: absolute;
  top: -4px;
  left: 4px;
  width: 16px;
  height: 6px;
  border-top: 2px solid rgba(80,80,80,0.4);
  border-radius: 50% 50% 0 0;
  animation: birdWing 1s ease-in-out infinite;
}

@keyframes birdFly {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(-10px); }
}

@keyframes birdWing {
  0%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(0.5); }
}

/* Boat */
.boat {
  bottom: 40%;
  left: 20%;
  width: 50px;
  height: 15px;
}

.boat::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 40px;
  height: 8px;
  background: rgba(80,60,40,0.5);
  border-radius: 0 0 50% 50%;
  animation: boatRock 3s ease-in-out infinite;
}

.boat::after {
  content: '';
  position: absolute;
  bottom: 8px;
  left: 15px;
  width: 2px;
  height: 20px;
  background: rgba(80,60,40,0.4);
}

@keyframes boatRock {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(3px) rotate(1deg); }
}

/* Squirrel */
.squirrel {
  bottom: 30%;
  right: 25%;
  width: 20px;
  height: 25px;
}

.squirrel::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 12px;
  height: 16px;
  background: rgba(140,100,60,0.5);
  border-radius: 50% 50% 30% 30%;
  animation: squirrelTwitch 4s ease-in-out infinite;
}

.squirrel::after {
  content: '';
  position: absolute;
  bottom: 10px;
  left: -4px;
  width: 8px;
  height: 12px;
  background: rgba(140,100,60,0.4);
  border-radius: 50%;
  transform: rotate(-20deg);
  animation: squirrelTail 3s ease-in-out infinite;
}

@keyframes squirrelTwitch {
  0%, 90%, 100% { transform: translateY(0); }
  95% { transform: translateY(-2px); }
}

@keyframes squirrelTail {
  0%, 100% { transform: rotate(-20deg); }
  50% { transform: rotate(-30deg); }
}

/* Glass effect */
.glass-reflection {
  position: absolute;
  inset: 24px 24px 24px 0;
  pointer-events: none;
  z-index: 6;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(255,255,255,0.03) 0%, transparent 40%),
    radial-gradient(ellipse at 80% 70%, rgba(255,255,255,0.02) 0%, transparent 30%);
  border: 1px solid rgba(255,255,255,0.03);
}

/* Sun/Moon */
.celestial-body {
  position: absolute;
  border-radius: 50%;
  z-index: 2;
}

.sun {
  width: 40px;
  height: 40px;
  background: radial-gradient(circle, rgba(255,220,150,0.6), rgba(255,180,100,0.2));
  box-shadow: 0 0 40px rgba(255,200,100,0.3);
}

.moon {
  width: 30px;
  height: 30px;
  background: radial-gradient(circle, rgba(220,230,255,0.4), rgba(180,200,240,0.1));
  box-shadow: 0 0 30px rgba(200,220,255,0.2);
}

/* --- Info Bar (top of screensaver) --- */
.info-bar {
  position: absolute;
  top: 0;
  left: 0; right: 0;
  height: 48px;
  background: linear-gradient(180deg, rgba(0,0,0,0.3), transparent);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 0 24px;
  z-index: 10;
  opacity: 0;
  transition: opacity 1s ease;
}

.info-bar.visible { opacity: 1; }

.info-bar-label {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 2px;
}

.info-bar-divider {
  width: 1px;
  height: 14px;
  background: rgba(255,255,255,0.15);
}

.info-bar-weather {
  font-size: 13px;
  color: rgba(255,255,255,0.4);
  display: flex;
  align-items: center;
  gap: 6px;
}

.info-bar-weather-icon {
  font-size: 14px;
}

/* --- AOD SCREEN --- */
#screen-aod {
  display: flex;
  align-items: center;
  justify-content: center;
}

.aod-scene {
  position: absolute;
  inset: 0;
  filter: brightness(0.15) saturate(0) contrast(1.2);
  transition: filter 3s ease;
}

/* Sketch filter simulation */
.sketch-overlay {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 3s ease;
  pointer-events: none;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.01) 2px, rgba(255,255,255,0.01) 3px),
    repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.01) 2px, rgba(255,255,255,0.01) 3px);
  mix-blend-mode: overlay;
}

.sketch-overlay.active {
  opacity: 1;
}

.aod-paper-texture {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 3s ease;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(200,180,150,0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 60%, rgba(180,170,140,0.02) 0%, transparent 40%);
}

.aod-paper-texture.active { opacity: 1; }

/* AOD Widgets (four corners) */
.aod-widget {
  position: absolute;
  z-index: 10;
  opacity: 0;
  transition: opacity 2s ease 1s;
}

.aod-widget.visible { opacity: 1; }

.aod-widget-time {
  top: 40px;
  left: 50px;
  font-family: var(--font-cn);
  font-size: 48px;
  font-weight: 200;
  color: rgba(255,255,255,0.25);
  letter-spacing: 4px;
}

.aod-widget-date {
  top: 40px;
  right: 50px;
  font-size: 16px;
  font-weight: 300;
  color: rgba(255,255,255,0.15);
  letter-spacing: 2px;
}

.aod-widget-weather {
  bottom: 40px;
  left: 50px;
  font-size: 14px;
  color: rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  gap: 8px;
}

.aod-widget-poem {
  bottom: 40px;
  right: 50px;
  font-family: var(--font-cn);
  font-size: 14px;
  font-weight: 200;
  color: rgba(255,255,255,0.12);
  letter-spacing: 2px;
  text-align: right;
  max-width: 300px;
  line-height: 1.8;
}

/* AOD breathing animation */
.aod-breathing {
  animation: aodBreathe 6s ease-in-out infinite;
}

@keyframes aodBreathe {
  0%, 100% { filter: brightness(0.15) saturate(0) contrast(1.2); }
  50% { filter: brightness(0.18) saturate(0) contrast(1.15); }
}

/* ============================================
   CONTROL PANEL (God Mode)
   ============================================ */
#controlPanel {
  position: fixed;
  right: -380px;
  top: 0;
  bottom: 0;
  width: 380px;
  background: rgba(10,10,15,0.97);
  backdrop-filter: blur(20px);
  border-left: 1px solid rgba(255,255,255,0.08);
  z-index: 100;
  transition: right 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
  overflow-y: auto;
  padding: 24px;
}

#controlPanel.open { right: 0; }

.cp-toggle {
  position: fixed;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 101;
  width: 32px;
  height: 80px;
  background: rgba(20,20,30,0.9);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px 0 0 8px;
  color: rgba(255,255,255,0.4);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: right 0.4s cubic-bezier(0.25, 0.1, 0.25, 1), background 0.2s;
  writing-mode: vertical-lr;
  letter-spacing: 2px;

<script>
// ============================================

const State = {

};

let appState = {
  currentScreen: State.HOME,
  timeOfDay: 'morning',    // morning, daytime, evening, night
  weather: 'sunny',         // sunny, cloudy, rainy, snowy

  autoTimer: 0,
  shownPoems: [],           // Last 7 days shown poems
};

let autoTimerInterval = null;

// ============================================
// POEM DATABASE
// ============================================
const poems = [
  { text: '水光潋滟晴方好，山色空蒙雨亦奇。', source: '苏轼《饮湖上初晴后雨》', time: ['morning','daytime'], weather: ['sunny','cloudy'], season: ['spring','summer','autumn'] },
  { text: '欲把西湖比西子，淡妆浓抹总相宜。', source: '苏轼《饮湖上初晴后雨》', time: ['morning','daytime'], weather: ['sunny'], season: ['spring','summer'] },
  { text: '山外青山楼外楼，西湖歌舞几时休。', source: '林升《题临安邸》', time: ['daytime','evening'], weather: ['sunny','cloudy'], season: ['spring','summer','autumn'] },
  { text: '接天莲叶无穷碧，映日荷花别样红。', source: '杨万里《晓出净慈寺送林子方》', time: ['morning'], weather: ['sunny'], season: ['summer'] },
  { text: '几处早莺争暖树，谁家新燕啄春泥。', source: '白居易《钱塘湖春行》', time: ['morning','daytime'], weather: ['sunny','cloudy'], season: ['spring'] },
  { text: '乱花渐欲迷人眼，浅草才能没马蹄。', source: '白居易《钱塘湖春行》', time: ['morning'], weather: ['sunny'], season: ['spring'] },
  { text: '最爱湖东行不足，绿杨阴里白沙堤。', source: '白居易《钱塘湖春行》', time: ['daytime'], weather: ['sunny'], season: ['spring'] },
  { text: '黑云翻墨未遮山，白雨跳珠乱入船。', source: '苏轼《六月二十七日望湖楼醉书》', time: ['daytime','evening'], weather: ['rainy'], season: ['summer'] },
  { text: '卷地风来忽吹散，望湖楼下水如天。', source: '苏轼《六月二十七日望湖楼醉书》', time: ['evening'], weather: ['rainy','cloudy'], season: ['summer'] },
  { text: '孤山寺北贾亭西，水面初平云脚低。', source: '白居易《钱塘湖春行》', time: ['morning'], weather: ['cloudy'], season: ['spring'] },
  { text: '疏影横斜水清浅，暗香浮动月黄昏。', source: '林逋《山园小梅》', time: ['night','evening'], weather: ['sunny','cloudy'], season: ['winter'] },
  { text: '月落乌啼霜满天，江枫渔火对愁眠。', source: '张继《枫桥夜泊》', time: ['night'], weather: ['sunny','cloudy'], season: ['autumn','winter'] },
  { text: '毕竟西湖六月中，风光不与四时同。', source: '杨万里《晓出净慈寺送林子方》', time: ['morning','daytime'], weather: ['sunny'], season: ['summer'] },
  { text: '千里莺啼绿映红，水村山郭酒旗风。', source: '杜牧《江南春》', time: ['morning'], weather: ['sunny'], season: ['spring'] },
  { text: '南朝四百八十寺，多少楼台烟雨中。', source: '杜牧《江南春》', time: ['morning','daytime'], weather: ['rainy','cloudy'], season: ['spring'] },
  { text: '湖光秋月两相和，潭面无风镜未磨。', source: '刘禹锡《望洞庭》', time: ['night'], weather: ['sunny'], season: ['autumn'] },
  { text: '遥望洞庭山水翠，白银盘里一青螺。', source: '刘禹锡《望洞庭》', time: ['night','evening'], weather: ['sunny','cloudy'], season: ['autumn'] },
  { text: '雪里已知春信至，寒梅点缀琼枝腻。', source: '李清照《渔家傲》', time: ['morning','daytime'], weather: ['snowy'], season: ['winter'] },
  { text: '湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥。', source: '张岱《湖心亭看雪》', time: ['morning','daytime'], weather: ['snowy'], season: ['winter'] },
  { text: '雾凇沆砀，天与云与山与水，上下一白。', source: '张岱《湖心亭看雪》', time: ['morning'], weather: ['snowy'], season: ['winter'] },
  { text: '落日楼头，断鸿声里，江南游子。', source: '辛弃疾《水龙吟》', time: ['evening'], weather: ['sunny','cloudy'], season: ['autumn'] },
  { text: '春水碧于天，画船听雨眠。', source: '韦庄《菩萨蛮》', time: ['daytime'], weather: ['rainy'], season: ['spring'] },
  { text: '烟雨暗千家。', source: '苏轼《望江南》', time: ['evening','night'], weather: ['rainy'], season: ['spring','autumn'] },
  { text: '一蓑烟雨任平生。', source: '苏轼《定风波》', time: ['daytime'], weather: ['rainy'], season: ['spring','summer','autumn'] },
  { text: '小楼一夜听春雨，深巷明朝卖杏花。', source: '陆游《临安春雨初霁》', time: ['night','morning'], weather: ['rainy'], season: ['spring'] },
];

const weatherIcons = { sunny: '☀', cloudy: '☁', rainy: '🌧', snowy: '❄' };
const weatherTexts = { sunny: '晴', cloudy: '阴', rainy: '雨', snowy: '雪' };
const seasonNames = { spring: '春', summer: '夏', autumn: '秋', winter: '冬' };
const timeNames = { morning: '晨间', daytime: '日间', evening: '暮间', night: '夜间' };
const timeRanges = { morning: '06:00-10:00', daytime: '10:00-16:00', evening: '16:00-20:00', night: '20:00-06:00' };
const tempMap = {
  sunny: { spring: 18, summer: 30, autumn: 20, winter: 5 },
  cloudy: { spring: 15, summer: 26, autumn: 17, winter: 3 },
  rainy: { spring: 12, summer: 22, autumn: 14, winter: 1 },
  snowy: { spring: 5, summer: 22, autumn: 8, winter: -2 },
};

// ============================================
// POEM MATCHING
// ============================================
function matchPoem() {
  let candidates = poems.filter(p =>
    p.time.includes(appState.timeOfDay) &&
    p.weather.includes(appState.weather) &&
    p.season.includes(appState.season)
  );

  // Anti-repeat: filter out recently shown
  candidates = candidates.filter(p => !appState.shownPoems.includes(p.text));
  if (candidates.length === 0) candidates = poems; // fallback

  const poem = candidates[Math.floor(Math.random() * candidates.length)];
  appState.shownPoems.push(poem.text);
  if (appState.shownPoems.length > 50) appState.shownPoems.shift();
  return poem;
}

// ============================================
// SCREEN TRANSITIONS
// ============================================
function switchScreen(target) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(`screen-${target}`).classList.add('active');
  appState.currentScreen = target;
  updateStateIndicator();
}

function updateStateIndicator() {
  const stateTexts = {
    home: '主页 / 待机',
    poem: '每日一诗',
    screensaver: '窗景屏保',
    aod: '息屏显示模式'
  };
  document.getElementById('stateText').textContent = `状态：${stateTexts[appState.currentScreen]}`;

  const dotColors = { home: '#F59E0B', poem: '#3B82F6', screensaver: '#4ADE80', aod: '#737373' };
  document.getElementById('stateDot').style.background = dotColors[appState.currentScreen];
}

// ============================================
// UPDATE SCENE VISUALS
// ============================================
function updateScene() {
  // Scene base (time of day)
  const sceneBase = document.getElementById('sceneBase');
  sceneBase.className = `scene-base ${appState.timeOfDay}`;

  // Weather overlay
  const weatherOverlay = document.getElementById('weatherOverlay');
  weatherOverlay.className = 'weather-overlay';
  if (appState.weather !== 'sunny') {
    weatherOverlay.classList.add(appState.weather);
    weatherOverlay.classList.add('active');
  }

  // Celestial body
  const celestial = document.getElementById('celestialBody');
  if (appState.timeOfDay === 'night' || appState.timeOfDay === 'evening') {
    celestial.className = 'celestial-body moon';
    if (appState.timeOfDay === 'night') {
      celestial.style.top = '15%';
      celestial.style.right = '30%';
    } else {
      celestial.style.top = '45%';
      celestial.style.right = '10%';
    }
  } else {
    celestial.className = 'celestial-body sun';
    if (appState.timeOfDay === 'morning') {
      celestial.style.top = '35%';
      celestial.style.right = '15%';
    } else {
      celestial.style.top = '15%';
      celestial.style.right = '25%';
    }
  }

  // Info bar
  const temp = tempMap[appState.weather][appState.season];
  document.getElementById('infoBarWeatherIcon').textContent = weatherIcons[appState.weather];
  document.getElementById('infoBarWeatherText').textContent = weatherTexts[appState.weather];
  document.getElementById('infoBarTemp').textContent = `${temp}°C`;
  document.getElementById('infoBarTime').textContent = getTimeDisplay();

  // AOD updates
  const aodSceneBase = document.getElementById('aodSceneBase');
  aodSceneBase.className = `scene-base ${appState.timeOfDay}`;
  document.getElementById('aodWidgetTime').textContent = getTimeDisplay();
  document.getElementById('aodWidgetDate').textContent = getTodayDate();
  document.getElementById('aodWeatherIcon').textContent = weatherIcons[appState.weather];
  document.getElementById('aodWeatherText').textContent = weatherTexts[appState.weather];
  document.getElementById('aodTemp').textContent = `${temp}°C`;

  // Random characters for screensaver
  updateCharacters();
}

function getTimeDisplay() {
  const times = { morning: '06:30', daytime: '12:00', evening: '17:30', night: '22:00' };
  return times[appState.timeOfDay];
}

function getTodayDate() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function updateCharacters() {
  // Randomly show 1-3 characters
  const chars = ['char-bird', 'char-boat', 'char-squirrel'];
  const count = 1 + Math.floor(Math.random() * 3);
  const shuffled = chars.sort(() => Math.random() - 0.5);

  chars.forEach(id => {
    const el = document.getElementById(id);
    if (shuffled.includes(id) && count > 0) {
      el.classList.add('visible');
    } else {
      el.classList.remove('visible');
    }
  });
}

// ============================================
// FLOW: HOME → POEM → SCREENSAVER → AOD
// ============================================
function enterScreensaver() {
  // Step 1: Show poem
  switchScreen('poem');
  showPoem();

  // Step 2: After poem fades, show screensaver
  setTimeout(() => {
    switchScreen('screensaver');
    document.getElementById('infoBar').classList.add('visible');
    startAutoTimer();
  }, 6000);
}

function showPoem() {
  const poem = matchPoem();
  const textEl = document.getElementById('poemText');
  const sourceEl = document.getElementById('poemSource');
  const contextEl = document.getElementById('poemContext');

  textEl.textContent = poem.text;
  sourceEl.textContent = `—— ${poem.source}`;
  contextEl.textContent = `${seasonNames[appState.season]}季 · ${timeNames[appState.timeOfDay]} · ${weatherTexts[appState.weather]} · 西湖`;

  // Fade in
  setTimeout(() => {
    textEl.classList.add('visible');
    sourceEl.classList.add('visible');
    contextEl.classList.add('visible');
  }, 300);

  // Fade out
  setTimeout(() => {
    textEl.classList.remove('visible');
    textEl.classList.add('fading');
    sourceEl.classList.remove('visible');
    contextEl.classList.remove('visible');
  }, 5000);

  // Update poem history in control panel
  updatePoemHistory(poem);
}

function updatePoemHistory(poem) {
  const el = document.getElementById('poemHistory');
  const entry = document.createElement('div');
  entry.style.marginBottom = '8px';
  entry.style.paddingBottom = '8px';
  entry.style.borderBottom = '1px solid rgba(255,255,255,0.04)';
  entry.innerHTML = `<div style="color:rgba(255,255,255,0.5);margin-bottom:2px;">${poem.text}</div><div style="color:rgba(255,255,255,0.25);font-size:11px;">${poem.source}</div>`;
  el.insertBefore(entry, el.firstChild);

  // Keep only last 5
  while (el.children.length > 5) {
    el.removeChild(el.lastChild);
  }
}

function enterAOD() {
  switchScreen('aod');
  document.getElementById('infoBar').classList.remove('visible');

  // Activate sketch and paper texture
  setTimeout(() => {
    document.getElementById('sketchOverlay').classList.add('active');
    document.getElementById('aodPaperTexture').classList.add('active');
  }, 500);

  // Show widgets after delay
  setTimeout(() => {
    document.querySelectorAll('.aod-widget').forEach(w => w.classList.add('visible'));
  }, 1500);

  // Set poem widget
  const poem = matchPoem();
  document.getElementById('aodWidgetPoem').textContent = poem.text;

  stopAutoTimer();
}

function triggerWake() {
  // Remove AOD effects
  document.getElementById('sketchOverlay').classList.remove('active');
  document.getElementById('aodPaperTexture').classList.remove('active');
  document.querySelectorAll('.aod-widget').forEach(w => w.classList.remove('visible'));

  switchScreen('home');
  stopAutoTimer();
  appState.autoTimer = 0;
  updateTimerDisplay();
}

function resetJourney() {
  stopAutoTimer();
  appState.autoTimer = 0;
  appState.currentScreen = State.HOME;
  document.getElementById('sketchOverlay').classList.remove('active');
  document.getElementById('aodPaperTexture').classList.remove('active');
  document.querySelectorAll('.aod-widget').forEach(w => w.classList.remove('active'));
  document.getElementById('infoBar').classList.remove('visible');
  switchScreen('home');
  updateTimerDisplay();
}

// ============================================
// AUTO TIMER
// ============================================
function startAutoTimer() {
  stopAutoTimer();
  appState.autoTimer = 0;
  autoTimerInterval = setInterval(() => {
    appState.autoTimer++;
    updateTimerDisplay();

    // Auto-enter AOD after delay (if enabled)
    if (appState.aodEnabled && appState.currentScreen === 'screensaver' && appState.autoTimer >= appState.aodDelayMinutes * 60) {
      enterAOD();
    }
  }, 1000); // Every second (for demo, we use real seconds)
}

function stopAutoTimer() {
  if (autoTimerInterval) {
    clearInterval(autoTimerInterval);
    autoTimerInterval = null;
  }
}

function updateTimerDisplay() {
  const mins = Math.floor(appState.autoTimer / 60);
  const secs = appState.autoTimer % 60;
  document.getElementById('autoTimer').textContent =
    `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
}

// ============================================
// CONTROL PANEL
// ============================================
function toggleCP() {
  document.getElementById('controlPanel').classList.toggle('open');
}

function triggerScreensaver() {
  if (appState.currentScreen === 'screensaver' || appState.currentScreen === 'aod') return;
  enterScreensaver();
}

function triggerAOD() {
  if (appState.currentScreen !== 'screensaver') {
    // Force go to screensaver first, then AOD
    switchScreen('screensaver');
    document.getElementById('infoBar').classList.add('visible');
    setTimeout(() => enterAOD(), 1000);
  } else {
    enterAOD();
  }
}

// Time control
function onTimeChange(val) {
  const h = Math.floor(val / 4);
  const m = (val % 4) * 15;
  const timeStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  document.getElementById('timeValue').textContent = `${timeNames[appState.timeOfDay]} ${timeStr}`;
}

function setTimeOfDay(tod, btn) {
  appState.timeOfDay = tod;
  document.querySelectorAll('[data-time]').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  updateScene();
  updateTimeButtons();
}

function updateTimeButtons() {
  document.querySelectorAll('[data-time]').forEach(b => {
    b.classList.toggle('active', b.dataset.time === appState.timeOfDay);
  });
}

// Weather control
function setWeather(w, btn) {
  appState.weather = w;
  document.querySelectorAll('[data-weather]').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  updateScene();
}

// Season control
function setSeason(s, btn) {
  appState.season = s;
  document.querySelectorAll('[data-season]').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  updateScene();
}

// AOD toggle
function toggleAOD(enabled) {
  appState.aodEnabled = enabled;
  document.getElementById('aodToggleOn').classList.toggle('active', enabled);
  document.getElementById('aodToggleOff').classList.toggle('active', !enabled);
}

function onAODDelayChange(val) {
  appState.aodDelayMinutes = parseInt(val);
  document.getElementById('aodDelayValue').textContent = `${val} min`;
}

// ============================================
// USER INTERACTION (wake from home)
// ============================================
document.getElementById('screen-home').addEventListener('click', () => {
  if (appState.currentScreen === 'home') {
    enterScreensaver();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    toggleCP();
    return;
  }
  if (appState.currentScreen === 'home') {
    enterScreensaver();
  } else if (appState.currentScreen === 'aod') {
    triggerWake();
  } else if (appState.currentScreen === 'screensaver') {
    triggerWake();
  }
});

// ============================================
// INIT
// ============================================
updateScene();
updateStateIndicator();
</script>
</body>
</html>
