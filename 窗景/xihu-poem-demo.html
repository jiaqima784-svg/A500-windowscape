<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>西湖窗景 · 每日一句诗词</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#060e18;font-family:"KaiTi","楷体","STKaiti","STSong","SimSun",serif;user-select:none}

/* ═══ 背景层（16:9 保持比例） ═══ */
#bg-wrap{position:fixed;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;background:#0a1628}
#bg-img{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center;display:block;filter:brightness(.72) saturate(1.05);transition:filter 2s ease,opacity 1.2s ease;opacity:0;aspect-ratio:16/9}
#bg-img.loaded{opacity:1}
#bg-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,8,18,.25) 0%,rgba(0,8,18,.02) 30%,rgba(0,8,18,.02) 70%,rgba(0,8,18,.5) 100%)}
#rain-canvas{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s}
body.w-rain #rain-canvas{opacity:1}
#fog-layer{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 2s;background:rgba(195,208,218,.26)}
body.w-fog #fog-layer{opacity:1;animation:fogP 9s ease-in-out infinite}
@keyframes fogP{0%,100%{opacity:.9}50%{opacity:.5}}
.snowflake{position:fixed;top:-24px;color:#d6eaf8;pointer-events:none;z-index:5;animation:snowF linear infinite}
@keyframes snowF{0%{transform:translateY(0) rotate(0);opacity:.75}100%{transform:translateY(110vh) rotate(400deg);opacity:0}}

/* ═══ 顶部状态栏 ═══ */
#status-bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:clamp(10px,1.8vh,22px) clamp(16px,3vw,48px);background:linear-gradient(180deg,rgba(0,8,18,.45),transparent)}
#clock-wrap{color:rgba(255,255,255,.88);text-shadow:0 1px 8px rgba(0,0,0,.55)}
#clock-time{font-size:clamp(20px,3vw,46px);font-weight:300;letter-spacing:.04em;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
#clock-date{font-size:clamp(10px,1vw,16px);opacity:.72;font-family:"PingFang SC","Microsoft YaHei",sans-serif;margin-top:2px}
#weather-info{display:flex;align-items:center;gap:clamp(8px,1.5vw,18px);color:rgba(255,255,255,.82);text-shadow:0 1px 6px rgba(0,0,0,.5);font-family:"PingFang SC","Microsoft YaHei",sans-serif}
#weather-icon{font-size:clamp(18px,2.5vw,36px)}
#weather-text{font-size:clamp(10px,1.1vw,16px);line-height:1.55;text-align:right}
#weather-desc{font-size:clamp(12px,1.3vw,18px);font-weight:500}
#audio-btn{background:rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:50%;width:clamp(34px,3.5vw,50px);height:clamp(34px,3.5vw,50px);display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.85);font-size:clamp(13px,1.5vw,20px);transition:background .3s,transform .2s;flex-shrink:0}
#audio-btn:hover{background:rgba(255,255,255,.18);transform:scale(1.08)}
#audio-btn.playing{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.2)}50%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}

/* ═══ 竖排诗词区域（右侧，无底色，手写风，一句一列） ═══ */
#poem-scroll{
  position:fixed;
  top:50%;right:clamp(24px,5vw,80px);
  transform:translateY(-50%);
  z-index:10;
  opacity:0;
  transition:opacity .7s ease;
  pointer-events:none;
  max-height:80vh;
}
#poem-scroll.visible{opacity:1}

/* 诗词容器 - 竖排从右到左 */
#poem-container{
  display:flex;
  flex-direction:row-reverse; /* 从右到左排列各列 */
  gap:clamp(12px,1.5vw,24px);
  align-items:flex-start;
}

/* 每一句诗（一列） */
.poem-line{
  writing-mode:vertical-rl;
  text-orientation:mixed;
  font-family:"KaiTi","楷体","STKaiti","FangSong","仿宋",serif;
  font-size:clamp(22px,2.8vw,42px);
  line-height:1.6;
  letter-spacing:.15em;
  color:rgba(255,252,235,.95);
  text-shadow:
    0 1px 3px rgba(0,0,0,.6),
    0 0 20px rgba(0,0,0,.3);
  filter:drop-shadow(0 0 1px rgba(0,0,0,.4));
  white-space:nowrap;
}

/* 署名列 */
#poem-sig-col{
  writing-mode:vertical-rl;
  text-orientation:mixed;
  font-family:"KaiTi","楷体","STKaiti",serif;
  font-size:clamp(12px,1.3vw,20px);
  color:rgba(215,190,110,.78);
  letter-spacing:.12em;
  text-shadow:0 1px 4px rgba(0,0,0,.5);
  margin-right:clamp(8px,1vw,16px);
  padding-top:clamp(20px,2vh,40px);
}

#poem-context-tag{
  position:fixed;
  bottom:clamp(110px,12vh,150px);
  right:clamp(24px,5vw,80px);
  z-index:12;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:clamp(9px,.8vw,12px);
  color:rgba(255,255,255,.32);
  letter-spacing:.08em;
  opacity:0;
  transition:opacity .7s ease;
  pointer-events:none;
}
#poem-context-tag.visible{opacity:1}

/* ═══ 情感标签 ═══ */
#emotion-tag{
  position:fixed;
  bottom:clamp(80px,10vh,120px);
  right:clamp(24px,5vw,80px);
  z-index:12;
  display:flex;
  align-items:center;
  gap:clamp(6px,.6vw,12px);
  opacity:0;
  transition:opacity .7s ease;
  pointer-events:none;
}
#emotion-tag.visible{opacity:1}

.emotion-name{
  font-family:"KaiTi","楷体","STKaiti",serif;
  font-size:clamp(12px,1.2vw,20px);
  color:rgba(215,190,110,.9);
  letter-spacing:.1em;
  text-shadow:0 1px 4px rgba(0,0,0,.4);
}

.emotion-dot{
  font-size:clamp(10px,1vw,14px);
  color:rgba(215,190,110,.5);
}

.emotion-desc{
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:clamp(9px,.85vw,13px);
  color:rgba(255,255,255,.45);
  letter-spacing:.06em;
}

/* ═══ 意境元素 ═══ */
#elements-tag{
  position:fixed;
  bottom:clamp(145px,15vh,185px);
  right:clamp(24px,5vw,80px);
  z-index:12;
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:clamp(6px,.6vw,12px);
  max-width:clamp(200px,25vw,300px);
  opacity:0;
  transition:opacity .7s ease;
  pointer-events:none;
}
#elements-tag.visible{opacity:1}

.element-item{
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:clamp(8px,.75vw,11px);
  padding:clamp(3px,.3vh,6px) clamp(8px,.9vw,14px);
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:24px;
  color:rgba(255,255,255,.55);
  letter-spacing:.05em;
}

/* ═══ 底部加载提示 ═══ */
#loading-tip{position:fixed;bottom:clamp(80px,8vh,110px);left:50%;transform:translateX(-50%);z-index:20;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:clamp(10px,1vw,14px);color:rgba(255,255,255,.38);letter-spacing:.1em;transition:opacity .8s}
#img-credit{position:fixed;bottom:clamp(10px,1.5vh,18px);left:clamp(12px,2vw,28px);z-index:20;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:clamp(9px,.75vw,11px);color:rgba(255,255,255,.22);letter-spacing:.05em}

/* ═══ 模式按钮 ═══ */
#mode-bar{position:fixed;bottom:clamp(12px,2vh,24px);right:clamp(12px,2vw,28px);z-index:30;display:flex;gap:clamp(6px,1vw,12px);align-items:center}
.mode-btn{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:clamp(10px,1vw,14px);padding:clamp(5px,.7vh,10px) clamp(14px,1.8vw,24px);border-radius:24px;cursor:pointer;transition:all .35s;letter-spacing:.06em;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.32);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:rgba(255,255,255,.65)}
.mode-btn:hover{background:rgba(255,255,255,.12)}
.mode-btn.active{background:rgba(215,175,60,.25);border-color:rgba(215,175,60,.7);color:rgba(255,230,120,.98);box-shadow:0 0 20px rgba(215,175,60,.15)}

/* ═══ 我的·西湖 控制面板 ═══ */
#my-panel{position:fixed;bottom:clamp(60px,7vh,80px);left:50%;transform:translateX(-50%);z-index:30;width:min(780px,94vw);background:rgba(0,0,0,.55);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:clamp(16px,2.5vh,28px) clamp(16px,3vw,44px);opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;transform:translateX(-50%) translateY(12px)}
#my-panel.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.panel-row{display:flex;align-items:center;gap:clamp(10px,1.8vw,24px);margin-top:clamp(8px,1.2vh,14px);flex-wrap:wrap}
.panel-label{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:clamp(11px,1vw,15px);color:rgba(200,200,200,.65);white-space:none;min-width:2.5em}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.seg-btn{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:clamp(11px,1vw,15px);padding:clamp(4px,.6vh,8px) clamp(12px,1.4vw,20px);border-radius:4px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:rgba(255,255,255,.7);cursor:pointer;transition:background .2s,border-color .2s,color .2s;letter-spacing:.06em}
.seg-btn:hover{background:rgba(255,255,255,.15)}
.seg-btn.active{background:rgba(220,180,80,.25);border-color:rgba(220,180,80,.7);color:rgba(255,230,120,.98)}
#btn-random{margin-left:auto;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:clamp(11px,1vw,15px);padding:clamp(5px,.7vh,10px) clamp(16px,2vw,28px);background:rgba(220,160,60,.2);border:1px solid rgba(220,180,80,.45);color:rgba(255,230,120,.92);border-radius:6px;cursor:pointer;transition:background .2s,transform .15s;letter-spacing:.08em}
#btn-random:hover{background:rgba(220,160,60,.35);transform:scale(1.04)}
</style>
</head>
<body>

<div id="bg-wrap">
  <img id="bg-img" src="" alt="西湖风景"/>
  <div id="bg-grad"></div>
  <canvas id="rain-canvas"></canvas>
  <div id="fog-layer"></div>
</div>

<div id="status-bar">
  <div id="clock-wrap">
    <div id="clock-time">--:--:--</div>
    <div id="clock-date">正在获取时间...</div>
  </div>
  <div id="weather-info">
    <div id="weather-icon">☁</div>
    <div id="weather-text">
      <div id="weather-desc">正在获取天气...</div>
      <div id="weather-temp" style="font-size:clamp(9px,.85vw,13px);opacity:.7;margin-top:1px"></div>
    </div>
  </div>
  <button id="audio-btn" onclick="toggleAudio()" title="西湖白噪音">🌊</button>
</div>

<!-- 竖排诗词（右侧，无底色，一句一列） -->
<div id="poem-scroll">
  <div id="poem-container">
    <!-- 诗句列将动态插入 -->
    <div id="poem-sig-col"></div>
  </div>
</div>
<div id="poem-context-tag"></div>

<!-- 意境元素 -->
<div id="elements-tag"></div>

<!-- 情感标签 -->
<div id="emotion-tag">
  <span class="emotion-name"></span>
  <span class="emotion-dot">·</span>
  <span class="emotion-desc"></span>
</div>

<div id="loading-tip">正在获取西湖实况天气...</div>
<div id="img-credit"></div>

<!-- 模式切换按钮 -->
<div id="mode-bar">
  <button class="mode-btn active" id="btn-now" onclick="switchMode('now')">此刻·西湖</button>
  <button class="mode-btn" id="btn-my" onclick="switchMode('my')">我的·西湖</button>
</div>

<!-- 我的·西湖 控制面板 -->
<div id="my-panel">
  <div class="panel-row">
    <span class="panel-label">季节</span>
    <div class="btn-group" id="sg-season">
      <button class="seg-btn active" data-v="spring" onclick="mySel('season',this)">春</button>
      <button class="seg-btn" data-v="summer" onclick="mySel('season',this)">夏</button>
      <button class="seg-btn" data-v="autumn" onclick="mySel('season',this)">秋</button>
      <button class="seg-btn" data-v="winter" onclick="mySel('season',this)">冬</button>
    </div>
    <span class="panel-label" style="margin-left:clamp(8px,2vw,24px)">时段</span>
    <div class="btn-group" id="sg-period">
      <button class="seg-btn active" data-v="dawn" onclick="mySel('period',this)">晨</button>
      <button class="seg-btn" data-v="day" onclick="mySel('period',this)">日</button>
      <button class="seg-btn" data-v="dusk" onclick="mySel('period',this)">暮</button>
      <button class="seg-btn" data-v="night" onclick="mySel('period',this)">夜</button>
    </div>
  </div>
  <div class="panel-row">
    <span class="panel-label">天气</span>
    <div class="btn-group" id="sg-weather">
      <button class="seg-btn active" data-v="sunny" onclick="mySel('weather',this)">晴</button>
      <button class="seg-btn" data-v="rain" onclick="mySel('weather',this)">雨</button>
      <button class="seg-btn" data-v="snow" onclick="mySel('weather',this)">雪</button>
      <button class="seg-btn" data-v="fog" onclick="mySel('weather',this)">雾</button>
      <button class="seg-btn" data-v="cloudy" onclick="mySel('weather',this)">多云</button>
    </div>
    <button id="btn-random" onclick="myRandom()">🎲 随机</button>
  </div>
</div>

<!-- 西湖白噪音：水波声 -->
<audio id="bg-audio" loop preload="none" src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a73467.mp3"></audio>

<script>
// ╔═══════════════════════════════════════════════════════════════════╗
// ║ 0. 情感维度定义                                                  ║
// ╚═══════════════════════════════════════════════════════════════════╝
const EMOTIONS = {
  tranquil: { name: "静谧", desc: "心如止水", color: "#a8c8d8" },
  longing: { name: "怀远", desc: "思绪悠远", color: "#d4a5a5" },
  serene: { name: "悠然", desc: "闲适自在", color: "#b8d4b8" },
  melancholy: { name: "淡淡愁", desc: "若有若无", color: "#9aa5b8" },
  hopeful: { name: "期许", desc: "心怀盼望", color: "#e8d4a8" },
  nostalgic: { name: "怀旧", desc: "时光倒流", color: "#c4b8a8" },
  lonely: { name: "孤清", desc: "独处之美", color: "#a8b8c8" },
  peaceful: { name: "安宁", desc: "岁月静好", color: "#b8c8b8" },
  wistful: { name: "怅惘", desc: "欲说还休", color: "#b8a8b8" },
  joyful: { name: "欣然", desc: "心生欢喜", color: "#d4c8a8" }
};

// ╔═══════════════════════════════════════════════════════════════════╗
// ║ 1. 防重复机制 — sessionStorage + 主题/意象追踪                ║
// ╚═══════════════════════════════════════════════════════════════════╝
function getHistory(key){
  try{ return JSON.parse(sessionStorage.getItem("xihu_"+key)) || []; }catch(e){ return []; }
}
function pushHistory(key, id){
  const h = getHistory(key);
  h.push(id);
  const max = Math.max(5, Math.floor(h.length * 0.75) + 3);
  if(h.length > max) h.splice(0, h.length - max);
  sessionStorage.setItem("xihu_"+key, JSON.stringify(h));
}
function getRecentThemes(n=3){
  return getHistory("themes").slice(-n);
}
function pushTheme(theme){
  pushHistory("themes", theme);
}

// ╔═══════════════════════════════════════════════════════════════════╗
// ║ 2. 西湖背景图片库（用户本地图片 + 网络备选）                  ║
// ╚═══════════════════════════════════════════════════════════════════╝
const BG_IMAGES = [
  // 本地用户提供的西湖图（按季节-时段-天气命名）
  {url:"images/xihu-spring-sunny-dusk.jpg", tags:["spring","sunny","dusk","sunset"], desc:"西湖春暮", credit:"实景拍摄", local:true},
  {url:"images/xihu-spring-sunny-day.jpg",  tags:["spring","sunny","day"],        desc:"西湖春日", credit:"实景拍摄", local:true},
  {url:"images/xihu-spring-cloudy-dawn.jpg",tags:["spring","cloudy","dawn","sunrise"], desc:"西湖春晨", credit:"实景拍摄", local:true},
  {url:"images/xihu-autumn-cloudy-dawn.jpg",tags:["autumn","cloudy","dawn","sunrise"], desc:"西湖秋晨", credit:"实景拍摄", local:true},
  // 通用本地兜底
  {url:"images/xihu-dawn.jpg",  tags:["dawn","sunrise","spring","summer","autumn","winter","sunny","cloudy","fog"], desc:"西湖晨景", credit:"实景拍摄", local:true},
  {url:"images/xihu-dusk.jpg",  tags:["dusk","sunset","spring","summer","autumn","winter","sunny","cloudy"],     desc:"西湖暮景", credit:"实景拍摄", local:true},
  // 网络图片
  {url:"https://images.unsplash.com/photo-1472396961693-142e6e269027?w=1920&q=85", tags:["spring","sunny","day"],   desc:"苏堤春晓·春日艳阳", credit:"Unsplash"},
  {url:"https://images.unsplash.com/photo-1541232741-74f255d0ec7e?w=1920&q=85", tags:["spring","rain","autumn","rain"], desc:"细雨西湖·烟雨朦胧", credit:"Unsplash"},
  {url:"https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=85", tags:["summer","sunny","day"],   desc:"曲院风荷·接天莲叶", credit:"Unsplash"},
  {url:"https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1920&q=85", tags:["autumn","sunny","day"],   desc:"秋高气爽·平湖秋月", credit:"Unsplash"},
  {url:"https://images.unsplash.com/photo-1491555103944-7c647fd857e6?w=1920&q=85", tags:["winter","snow"],          desc:"断桥残雪·素裹银装", credit:"Unsplash"},
  {url:"https://images.unsplash.com/photo-1519904981063-b0cf448d479e?w=1920&q=85", tags:["fog","cloudy"],           desc:"西湖烟雨·雾气弥漫", credit:"Unsplash"},
  {url:"https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=1920&q=85", tags:["night"],                 desc:"西湖夜色·灯火阑珊", credit:"Unsplash"},
  {url:"https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=1920&q=85", tags:["dawn","sunrise"],        desc:"晨曦破晓·旭日东升", credit:"Unsplash"},
  {url:"https://images.unsplash.com/photo-1518623489648-a173ef7824f3?w=1920&q=85", tags:["dusk","sunset"],         desc:"雷峰夕照·残阳如血", credit:"Unsplash"},
  {url:"https://images.unsplash.com/photo-1544735716-392fe2489ffa?w=1920&q=85", tags:["any"],                    desc:"西湖全景·山水相映", credit:"Unsplash"},
];

// ╔═══════════════════════════════════════════════════════════════════╗
// ║ 3. 名人诗词库（绝句，带唯一 id、主题标签、情感、元素）         ║
// ╚═══════════════════════════════════════════════════════════════════╝
const CLASSIC = [
  // ── 春 ──

// ║ 5. WMO 天气代码解码                                            ║
// ╚═══════════════════════════════════════════════════════════════════╝
function decodeWMO(code, isDay){
  if(code===0)               return{label:"晴",icon:isDay?"☀️":"🌙",cat:"sunny"};
  if(code<=2)                return{label:"晴间多云",icon:"⛅",cat:"sunny"};
  if(code===3)               return{label:"阴天",icon:"☁️",cat:"cloudy"};
  if(code===45||code===48)   return{label:"大雾",icon:"🌫️",cat:"fog"};
  if(code>=51&&code<=57)     return{label:"毛毛雨",icon:"🌦️",cat:"rain"};
  if(code>=61&&code<=67)     return{label:"降雨",icon:"🌧️",cat:"rain"};
  if(code>=71&&code<=77)     return{label:"降雪",icon:"❄️",cat:"snow"};
  if(code>=80&&code<=82)     return{label:"阵雨",icon:"🌧️",cat:"rain"};
  if(code>=85&&code<=86)     return{label:"阵雪",icon:"🌨️",cat:"snow"};
  if(code>=95)               return{label:"雷雨",icon:"⛈️",cat:"rain"};
  return{label:"多云",icon:"⛅",cat:"cloudy"};
}

// ╔═══════════════════════════════════════════════════════════════════╗
// ║ 6. 工具函数                                                    ║
// ╚═══════════════════════════════════════════════════════════════════╝
const WEEK=["日","一","二","三","四","五","六"];
const SEASON_CN={spring:"春",summer:"夏",autumn:"秋",winter:"冬"};
const PERIOD_CN={dawn:"晨",day:"日间",dusk:"暮",night:"夜"};
const WEATHER_CN={sunny:"晴",rain:"雨",snow:"雪",fog:"雾",cloudy:"多云"};

function getSeason(m){return m>=3&&m<=5?"spring":m>=6&&m<=8?"summer":m>=9&&m<=11?"autumn":"winter";}
function getPeriod(h){return h>=5&&h<8?"dawn":h>=8&&h<17?"day":h>=17&&h<19?"dusk":"night";}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

// ╔═══════════════════════════════════════════════════════════════════╗
// ║ 7. 背景图选择（匹配实况 + 防重复）                              ║
// ╚═══════════════════════════════════════════════════════════════════╝
function chooseBg(season, period, weather){
  const tags=new Set([season, period, weather]);
  if(period==="dawn") tags.add("sunrise");
  if(period==="dusk") tags.add("sunset");
  if(period==="night") tags.add("night");
  const hist=getHistory("bg");
  const shuffled=[...BG_IMAGES].sort(()=>Math.random()-.5);
  let best=null, bestScore=-1;
  for(const img of shuffled){
    if(hist.includes(img.url)) continue;
    const score=img.tags.filter(t=>tags.has(t)).length;
    if(score>bestScore){bestScore=score;best=img;}
  }
  if(!best) best=shuffled.find(i=>i.tags.includes(period)) || pick(shuffled);
  pushHistory("bg",best.url);
  return best;
}

// ╔═══════════════════════════════════════════════════════════════════╗
// ║ 8. 诗词选择（防重复 + 名人/AI 各半 + 主题追踪 + 情感）         ║
// ╚═══════════════════════════════════════════════════════════════════╝
function pickPoem(season, period, weather, temp){
  const last=getHistory("type");
  const lastType=last.length?last[last.length-1]:"";
  let useAI;
  if(!last.length) useAI=Math.random()<.5;
  else if(lastType==="ai") useAI=false;
  else useAI=true;

  const recentThemes=getRecentThemes(3);

  if(useAI){
    const poem=pickAIPoem(season,period,weather,recentThemes);
    if(poem){
      pushHistory("type","ai");
      pushTheme(poem.theme);
      return{...poem, source:"AI 即兴"};
    }
  }
  const classic=pickClassicPoem(season,period,weather,recentThemes);
  if(classic){
    pushHistory("type","classic");
    pushTheme(classic.theme);
    return{...classic, source:"名人诗词"};
  }
  const ai=pickAIPoem(season,period,weather,recentThemes);
  if(ai){pushHistory("type","ai");pushTheme(ai.theme);return{...ai,source:"AI 即兴"};}
  pushHistory("type","classic");
  return{text:"欲把此间比西子\n淡妆浓抹总相宜",author:"苏轼",dynasty:"宋",source:"名人诗词",theme:"西子比景",emotion:"joyful",elements:["西子","淡妆","浓抹"]};
}

function pickClassicPoem(season,period,weather,recentThemes){
  const hist=getHistory("classic");
  const themeSet=new Set(recentThemes);
  let pool=CLASSIC.filter(p=>p.s===season&&p.p===period&&p.w===weather&&!hist.includes(p.id)&&!themeSet.has(p.theme));
  if(!pool.length) pool=CLASSIC.filter(p=>p.s===season&&p.p===period&&!hist.includes(p.id));
  if(!pool.length) pool=CLASSIC.filter(p=>p.s===season&&!hist.includes(p.id));
  if(!pool.length) pool=CLASSIC.filter(p=>p.s==="any"&&!hist.includes(p.id));
  if(!pool.length){
    pool=CLASSIC.filter(p=>p.s===season&&p.p===period&&p.w===weather);
    if(!pool.length) pool=CLASSIC.filter(p=>p.s===season);
    if(!pool.length) pool=CLASSIC.filter(p=>p.s==="any");
  }
  if(!pool.length) return null;
  const poem=pick(pool);
  pushHistory("classic",poem.id);
  return poem;
}

function pickAIPoem(season,period,weather,recentThemes){
  const key=`${season}-${period}-${weather}`;
  let arr=AI_TPL[key];
  if(!arr) arr=AI_TPL[`${season}-${period}-sunny`]||AI_TPL[`${season}-day-${weather}`]||null;
  if(!arr) return null;

  const themeSet=new Set(recentThemes);
  const filtered=arr.filter(p=>!themeSet.has(p.theme));
  const source=filtered.length?filtered:arr;
  return pick(source);
}

// ╔═══════════════════════════════════════════════════════════════════╗
// ║ 9. 天气特效                                                    ║
// ╚═══════════════════════════════════════════════════════════════════╝
let rainCtx,rainDrops=[],rainAF=null,snowEls=[];

function applyWeatherFX(cat){
  cancelAnimationFrame(rainAF);
  snowEls.forEach(e=>e.remove());snowEls=[];
  document.body.className="";
  const bgImg=document.getElementById("bg-img");
  bgImg.style.filter=cat==="fog"?"brightness(.62) saturate(.55) blur(3.5px)":cat==="snow"?"brightness(.84) saturate(.5)":cat==="rain"?"brightness(.68) saturate(.8)":"brightness(.72) saturate(1.05)";
  document.body.classList.add("w-"+cat);
  if(cat==="rain"){initRain();const loop=()=>{drawRain();rainAF=requestAnimationFrame(loop)};loop();}
  else if(cat==="snow") createSnow();
}

function initRain(){
  const c=document.getElementById("rain-canvas");c.width=innerWidth;c.height=innerHeight;
  rainCtx=c.getContext("2d");
  rainDrops=Array.from({length:220},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,len:Math.random()*22+10,speed:Math.random()*7+9,alpha:Math.random()*.38+.18}));
}
function drawRain(){
  if(!rainCtx)return;const c=document.getElementById("rain-canvas");rainCtx.clearRect(0,0,c.width,c.height);rainCtx.lineWidth=1;
  rainDrops.forEach(d=>{rainCtx.save();rainCtx.globalAlpha=d.alpha;rainCtx.strokeStyle="rgba(170,195,215,.7)";rainCtx.beginPath();rainCtx.moveTo(d.x,d.y);rainCtx.lineTo(d.x-d.len*.12,d.y+d.len);rainCtx.stroke();rainCtx.restore();d.y+=d.speed;if(d.y>c.height){d.y=-d.len;d.x=Math.random()*c.width;}});
}
function createSnow(){
  for(let i=0;i<55;i++){const el=document.createElement("div");el.className="snowflake";el.textContent="❄";el.style.cssText=`left:${Math.random()*100}vw;font-size:${Math.random()*14+7}px;animation-duration:${Math.random()*6+4}s;animation-delay:${Math.random()*6}s;opacity:${Math.random()*.55+.2}`;document.body.appendChild(el);snowEls.push(el);}
}
window.addEventListener("resize",()=>{const c=document.getElementById("rain-canvas");c.width=innerWidth;c.height=innerHeight;if(document.body.classList.contains("w-rain"))initRain();});

// ╔═══════════════════════════════════════════════════════════════════╗
// ║ 10. 竖排诗词展示动画（一句一列 + 情感维度）                    ║
// ╚═══════════════════════════════════════════════════════════════════╝
let poemTimer=null;
const poemScroll=document.getElementById("poem-scroll");
const poemContainer=document.getElementById("poem-container");
const poemTag=document.getElementById("poem-context-tag");
const emotionTag=document.getElementById("emotion-tag");
const elementsTag=document.getElementById("elements-tag");

function showPoem(season,period,weather,temp){
  if(poemTimer)clearTimeout(poemTimer);
  poemScroll.classList.remove("visible");
  poemTag.classList.remove("visible");
  emotionTag.classList.remove("visible");
  elementsTag.classList.remove("visible");
  
  setTimeout(()=>{
    const poem=pickPoem(season,period,weather,temp);
    
    // 清空容器
    poemContainer.innerHTML = '';
    
    // 添加署名列（最右侧）
    const sigCol = document.createElement('div');
    sigCol.id = 'poem-sig-col';
    if(poem.source==="AI 即兴"){
      sigCol.textContent = "——AI · 今日窗景";
    } else {
      sigCol.textContent = `——${poem.dynasty} · ${poem.author}`;
    }
    poemContainer.appendChild(sigCol);
    
    // 将诗句按换行分割，每句一列（从右到左）
    const lines = poem.text.split('\n');
    lines.forEach(line => {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'poem-line';
      lineDiv.textContent = line;
      poemContainer.appendChild(lineDiv);
    });

    // 底部上下文标签
    poemTag.textContent=`${SEASON_CN[season]||""} · ${PERIOD_CN[period]||""} · ${WEATHER_CN[weather]||weather}${temp?"  "+temp+"℃":""}`;

    // 情感标签
    const emotionInfo = EMOTIONS[poem.emotion];
    if(emotionInfo){
      emotionTag.querySelector('.emotion-name').textContent = emotionInfo.name;
      emotionTag.querySelector('.emotion-desc').textContent = emotionInfo.desc;
      emotionTag.classList.add("visible");
    }

    // 意境元素
    if(poem.elements && poem.elements.length > 0){
      elementsTag.innerHTML = '';
      poem.elements.forEach(el => {
        const span = document.createElement('span');
        span.className = 'element-item';
        span.textContent = el;
        elementsTag.appendChild(span);
      });
      elementsTag.classList.add("visible");
    }

    poemScroll.classList.add("visible");
    poemTag.classList.add("visible");
    poemTimer=setTimeout(()=>{
      poemScroll.classList.remove("visible");
      poemTag.classList.remove("visible");
      emotionTag.classList.remove("visible");
      elementsTag.classList.remove("visible");
    },10000);
  },600);
}

// ╔═══════════════════════════════════════════════════════════════════╗
// ║ 11. 时钟                                                       ║
// ╚═══════════════════════════════════════════════════════════════════╝
function updateClock(){
  const n=new Date();
  document.getElementById("clock-time").textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>String(v).padStart(2,"0")).join(":");
  document.getElementById("clock-date").textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 星期${WEEK[n.getDay()]}`;
}
setInterval(updateClock,1000);updateClock();

// ╔═══════════════════════════════════════════════════════════════════╗
// ║ 12. 西湖白噪音（水波声）                                       ║
// ╚═══════════════════════════════════════════════════════════════════╝
const audio=document.getElementById("bg-audio");
const audioBtn=document.getElementById("audio-btn");
audio.volume=.35;

function toggleAudio(){
  if(audio.paused){
    audio.play().catch(()=>{});
    audioBtn.textContent="🔊";
    audioBtn.classList.add("playing");
  }else{
    audio.pause();
    audioBtn.textContent="🌊";
    audioBtn.classList.remove("playing");
  }
}

// ╔═══════════════════════════════════════════════════════════════════╗
// ║ 13. 模式管理                                                   ║
// ╚═══════════════════════════════════════════════════════════════════╝
let currentMode="now";
let myState={season:"spring",period:"dawn",weather:"sunny"};

function switchMode(mode){
  currentMode=mode;
  document.getElementById("btn-now").classList.toggle("active",mode==="now");
  document.getElementById("btn-my").classList.toggle("active",mode==="my");
  document.getElementById("my-panel").classList.toggle("open",mode==="my");
  if(mode==="now"){
    document.getElementById("weather-info").style.opacity="1";
    fetchWeatherAndInit();
  } else {
    document.getElementById("weather-info").style.opacity=".4";
    triggerMyShow();
  }
}

function mySel(type,btn){
  const g=document.getElementById("sg-"+type);
  g.querySelectorAll(".seg-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  myState[type]=btn.dataset.v;
  triggerMyShow();
}

function myRandom(){
  const ss=["spring","summer","autumn","winter"];
  const pp=["dawn","day","dusk","night"];
  const ww=["sunny","rain","snow","fog","cloudy"];
  myState.season=pick(ss);myState.period=pick(pp);myState.weather=pick(ww);
  ["season","period","weather"].forEach(t=>{
    const g=document.getElementById("sg-"+t);
    g.querySelectorAll(".seg-btn").forEach(b=>b.classList.toggle("active",b.dataset.v===myState[t]));
  });
  triggerMyShow();
}

function triggerMyShow(){
  const s=myState.season,p=myState.period,w=myState.weather;
  applyWeatherFX(w);
  const bg=chooseBg(s,p,w);
  loadBgImage(bg);
  updateWeatherUI(null,WEATHER_CN[w]||w,null);
  setTimeout(()=>showPoem(s,p,w,null),1000);
}

// ╔═══════════════════════════════════════════════════════════════════╗
// ║ 14. 背景图加载（16:9 保持比例）                                ║
// ╚═══════════════════════════════════════════════════════════════════╝
function loadBgImage(info){
  const img=document.getElementById("bg-img");
  const credit=document.getElementById("img-credit");
  const fallbacks=[info.url,...BG_IMAGES.filter(i=>!i.local).map(i=>i.url).sort(()=>Math.random()-.5).slice(0,3)];
  let idx=0;
  function tryLoad(){
    if(idx>=fallbacks.length)return;
    const url=fallbacks[idx++];
    const tmp=new Image();
    tmp.onload=()=>{img.src=url;img.classList.add("loaded");credit.textContent=info.desc+" · "+info.credit;};
    tmp.onerror=()=>setTimeout(tryLoad,300);
    tmp.src=url;
  }
  tryLoad();
}

function updateWeatherUI(icon,label,temp){
  document.getElementById("weather-icon").textContent=icon||"☁";
  document.getElementById("weather-desc").textContent=label?`西湖·${label}`:document.getElementById("weather-desc").textContent;
  document.getElementById("weather-temp").textContent=temp?`${temp}℃  杭州西湖区`:"杭州西湖区";
}

// ╔═══════════════════════════════════════════════════════════════════╗
// ║ 15. 核心：此刻·西湖 — 获取实况天气                              ║
// ╚═══════════════════════════════════════════════════════════════════╝
async function fetchWeatherAndInit(){
  const tip=document.getElementById("loading-tip");
  tip.style.display="block";tip.style.opacity="1";
  tip.textContent="正在获取西湖实况天气...";

  const now=new Date();
  const season=getSeason(now.getMonth()+1);
  const period=getPeriod(now.getHours());
  let weatherCat="sunny",weatherLabel="晴",weatherIcon="☀️",tempStr="";

  try{
    const res=await fetch("https://api.open-meteo.com/v1/forecast?latitude=30.25&longitude=120.16&current_weather=true&timezone=Asia%2FShanghai",{signal:AbortSignal.timeout(6000)});
    if(!res.ok) throw new Error("API error");
    const data=await res.json();
    const cw=data.current_weather;
    const decoded=decodeWMO(cw.weathercode,cw.is_day);
    weatherCat=decoded.cat;weatherLabel=decoded.label;weatherIcon=decoded.icon;
    tempStr=Math.round(cw.temperature)+"";
    tip.textContent=`西湖实况：${weatherLabel} ${tempStr}℃ · 自动匹配诗词中...`;
  }catch(e){
    weatherCat=season==="winter"?"sunny":season==="spring"?(Math.random()<.4?"rain":"sunny"):Math.random()<.3?"rain":"sunny";
    weatherLabel=WEATHER_CN[weatherCat]||"晴";
    weatherIcon=weatherCat==="rain"?"🌧️":weatherCat==="snow"?"❄️":"☀️";
    tip.textContent="天气获取失败，已根据季节推算 · "+weatherLabel;
  }

  updateWeatherUI(weatherIcon,weatherLabel,tempStr);
  document.getElementById("weather-temp").textContent=tempStr?`${tempStr}℃  杭州西湖区`:"杭州西湖区";

  applyWeatherFX(weatherCat);
  const bg=chooseBg(season,period,weatherCat);
  loadBgImage(bg);

  setTimeout(()=>{
    showPoem(season,period,weatherCat,tempStr);
    tip.style.opacity="0";
    setTimeout(()=>tip.style.display="none",1000);
  },1200);
}

// ╔═══════════════════════════════════════════════════════════════════╗
// ║ 16. 启动                                                       ═
// ╚═══════════════════════════════════════════════════════════════════╝
fetchWeatherAndInit();
</script>
